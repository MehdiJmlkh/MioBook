<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap.min.css" />
    <link rel="stylesheet" href="bootstrap-icons.min.css" />
    <link rel="stylesheet" href="components/button/button.css" />
    <link rel="stylesheet" href="components/header/header.css" />
    <link rel="stylesheet" href="components/stars/stars.css" />
    <link rel="stylesheet" href="components/block-book/block-book.css" />
    <link rel="stylesheet" href="components/footer/footer.css" />
    <link rel="stylesheet" href="components/page-numbers/page-numbers.css" />
    <link rel="stylesheet" href="components/hero/hero.css" />
    <link rel="stylesheet" href="components/books-grid/books-grid.css" />
    <link rel="stylesheet" href="components/meow-icon/meow-icon.css" />
    <link rel="stylesheet" href="components/search-block/search-block.css" />
    <link rel="stylesheet" href="components/link/link.css" />
    <link rel="stylesheet" href="components/form/form.css" />
    <link rel="stylesheet" href="components/review-card/review-card.css" />
    <link rel="stylesheet" href="components/reviews-btn/reviews-btn.css" />
    <link rel="stylesheet" href="components/block/block.css" />
    <link rel="stylesheet" href="components/book/book.css" />
    <link rel="stylesheet" href="components/block-review/block-review.css" />
    <link rel="stylesheet" href="components/empty-card/empty-card.css" />
    <link rel="stylesheet" href="components/card-account/card-account.css" />
    <link rel="stylesheet" href="components/card-credit/card-credit.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="header">
      <span class="meow-icon header__icon">
        <img src="images/meow-icon.png" alt="" />
      </span>
    <div class="block-search search-box header__search-box">
        <span>Author</span>
        <i class="bi bi-chevron-down search-box__chevron"></i>
        <input type="text" class="search-box__input" placeholder="Search" />
    </div>
    <button class="btn btn-primary header__btn">Buy now</button>
</header>

<div class="grid grid--1x2">
    <div class="empty-card card-credit">
        <h1 class="empty-card__heading__title">$1,000</h1>
        <div class="card-credit__content">
            <input type="number" class="form-control" placeholder="$Amount" />
            <button class="btn btn-primary me">Add more credit</button>
        </div>
    </div>

    <div class="empty-card card-account">
        <div class="card-account__username">
            <i class="bi bi-person-circle"></i>
            <span>MehdiJmlkh</span>
        </div>
        <div>
            <i class="bi bi-envelope"></i>
            <span>mehdi.jamalkhah@ut.ac.ir</span>
        </div>
        <button class="btn btn-gray card-account__logout">logout</button>
    </div>
</div>

<div class="empty-card">
      <span class="empty-card__heading">
        <img class="empty-card__heading__icon" src="images/cart.svg" alt="" />
        <h1 class="empty-card__heading__title">Cart</h1>
      </span>
    <div class="empty-card__content">
        <img
                class="empty-card__empty-image"
                src="images/no-product.svg"
                alt=""
        />
        <p>No Product</p>
    </div>
</div>

<div class="empty-card">
      <span class="empty-card__heading">
        <img
                class="empty-card__heading__icon"
                src="images/history.svg"
                alt=""
        />
        <h1 class="empty-card__heading__title">History</h1>
      </span>
    <div class="empty-card__content">
        <img
                class="empty-card__empty-image"
                src="images/no-result.svg"
                alt=""
        />
        <p>No Result</p>
    </div>
</div>
<footer class="footer">
    <p class="footer__copyright">Copyright &copy; 2025 - MioBook</p>
</footer>
</body>
</html>
