<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="celticSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101927"/>
      <stop offset="45%" stop-color="#53644b"/>
      <stop offset="100%" stop-color="#c8a86a"/>
    </linearGradient>

    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60754b"/>
      <stop offset="100%" stop-color="#17251b"/>
    </linearGradient>

    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b59a"/>
      <stop offset="50%" stop-color="#817664"/>
      <stop offset="100%" stop-color="#3b3833"/>
    </linearGradient>

    <radialGradient id="mysticGlow">
      <stop offset="0%" stop-color="#f3dc91"/>
      <stop offset="100%" stop-color="#f3dc91" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

  </defs>


  <!-- Sky -->
  <rect width="600" height="900" fill="url(#celticSky)"/>


  <!-- Ancient moon -->
  <circle cx="450"
          cy="150"
          r="60"
          fill="#eadba8"/>


  <!-- Mystic light around stones -->
  <ellipse cx="300"
           cy="470"
           rx="250"
           ry="150"
           fill="url(#mysticGlow)"
           filter="url(#soft)"
           opacity="0.5"/>


  <!-- Rolling hills -->
  <path d="
      M0 430
      Q160 300 300 430
      Q450 300 600 440
      L600 650
      L0 650Z"
      fill="#344d35"/>


  <!-- Grass field -->
  <path d="
      M0 570
      Q250 500 600 580
      L600 900
      L0 900Z"
      fill="url(#grass)"/>


  <!-- Stone circle -->
  <g>

    <!-- standing stones -->
    <g fill="url(#stone)">

      <path d="
          M120 610
          L130 380
          Q170 340 200 390
          L210 610Z"/>


      <path d="
          M220 590
          L235 330
          Q280 290 310 350
          L315 590Z"/>


      <path d="
          M350 610
          L360 360
          Q410 320 440 390
          L450 610Z"/>


      <path d="
          M460 620
          L470 410
          Q510 380 540 430
          L550 620Z"/>

    </g>


    <!-- stones texture -->
    <g stroke="#5b5449"
       stroke-width="4"
       opacity="0.7">

      <line x1="160" y1="430" x2="170" y2="560"/>
      <line x1="260" y1="390" x2="280" y2="540"/>
      <line x1="390" y1="420" x2="410" y2="560"/>
      <line x1="490" y1="470" x2="510" y2="570"/>

    </g>

  </g>


  <!-- Celtic symbol on central stone -->
  <g>

    <circle cx="275"
            cy="420"
            r="55"
            fill="none"
            stroke="#d8b86a"
            stroke-width="6"/>


    <path d="
        M275 365
        Q340 420 275 475
        Q210 420 275 365"
        fill="none"
        stroke="#d8b86a"
        stroke-width="5"/>

  </g>


  <!-- Explorer -->
  <g>

    <circle cx="300"
            cy="650"
            r="25"
            fill="#1c1813"/>


    <path d="
        M250 900
        Q300 680 350 900Z"
        fill="#25231f"/>


    <!-- backpack -->
    <rect x="205"
          y="720"
          width="50"
          height="100"
          rx="10"
          fill="#60472c"/>


    <!-- lantern -->
    <circle cx="380"
            cy="760"
            r="50"
            fill="url(#mysticGlow)"
            filter="url(#soft)"/>


    <rect x="365"
          y="735"
          width="30"
          height="55"
          fill="#d6a64a"/>

  </g>


  <!-- Ancient map -->
  <g>

    <rect x="60"
          y="700"
          width="130"
          height="90"
          fill="#d8c18c"
          transform="rotate(-12 60 700)"/>


    <path d="
        M90 750
        Q130 720 170 760"
        fill="none"
        stroke="#76542b"
        stroke-width="4"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="105"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="62"
        font-weight="bold"
        fill="#ffffff">
    STONE CIRCLE
  </text>


  <text x="300"
        y="180"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="72"
        font-weight="bold"
        fill="#e7cf8b">
    QUEST
  </text>


  <!-- Genre -->
  <text x="300"
        y="230"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="7"
        fill="#f3e1b3">
    ADVENTURE • HISTORICAL
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Beatrix O'Malley
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#e8d3a2">
    EMERALD HOUSE • 1987
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d5bd7d"
        stroke-width="2"/>

</svg>