<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="cyberTokyo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="45%" stop-color="#172c46"/>
      <stop offset="100%" stop-color="#4c6c78"/>
    </linearGradient>

    <linearGradient id="neonBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#75f5ff"/>
      <stop offset="100%" stop-color="#2865ff"/>
    </linearGradient>

    <linearGradient id="hologram" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8ffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3be5ff" stop-opacity="0.1"/>
    </linearGradient>

    <radialGradient id="neonGlow">
      <stop offset="0%" stop-color="#00eaff"/>
      <stop offset="100%" stop-color="#00eaff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

  </defs>


  <!-- Futuristic night city -->
  <rect width="600" height="900" fill="url(#cyberTokyo)"/>


  <!-- Neon atmosphere -->
  <ellipse cx="300"
           cy="360"
           rx="260"
           ry="180"
           fill="url(#neonGlow)"
           filter="url(#glow)"/>


  <!-- Digital skyline -->
  <g fill="#080e18">

    <rect x="30"
          y="300"
          width="90"
          height="300"/>

    <rect x="150"
          y="220"
          width="120"
          height="380"/>

    <rect x="310"
          y="270"
          width="110"
          height="330"/>

    <rect x="460"
          y="180"
          width="100"
          height="420"/>

  </g>


  <!-- Building data lights -->
  <g fill="#5ff7ff">

    <rect x="55" y="350" width="15" height="8"/>
    <rect x="55" y="410" width="25" height="8"/>
    <rect x="180" y="290" width="35" height="8"/>
    <rect x="180" y="340" width="20" height="8"/>
    <rect x="350" y="330" width="30" height="8"/>
    <rect x="490" y="250" width="35" height="8"/>
    <rect x="490" y="310" width="20" height="8"/>

  </g>


  <!-- Digital circuit overlay -->
  <g fill="none"
     stroke="url(#neonBlue)"
     stroke-width="4">

    <path d="
        M80 150
        L220 150
        L220 230"/>

    <path d="
        M520 150
        L400 150
        L400 240"/>

    <path d="
        M100 650
        L240 650
        L240 580"/>

    <path d="
        M500 680
        L360 680
        L360 600"/>

  </g>


  <!-- Floating holographic map -->
  <g>

    <ellipse cx="300"
             cy="520"
             rx="150"
             ry="80"
             fill="url(#hologram)"
             opacity="0.5"/>


    <!-- Japan island shape -->
    <path d="
        M300 450
        Q340 500 310 540
        Q270 580 300 620
        Q340 650 360 590"
        fill="none"
        stroke="#9fffff"
        stroke-width="8"/>


    <!-- location nodes -->
    <g fill="#ffffff">

      <circle cx="330"
              cy="510"
              r="8"/>

      <circle cx="280"
              cy="570"
              r="8"/>

      <circle cx="350"
              cy="600"
              r="8"/>

    </g>

  </g>


  <!-- Hacker traveler silhouette -->
  <g fill="#05080d">

    <!-- hood -->
    <path d="
        M250 450
        Q320 370 390 450
        L380 540
        L260 540Z"/>


    <!-- face screen -->
    <rect x="285"
          y="470"
          width="70"
          height="35"
          rx="5"
          fill="#2cdae8"/>


    <!-- body -->
    <path d="
        M220 620
        Q320 520 420 620
        L500 850
        L140 850Z"/>


    <!-- laptop -->
    <rect x="360"
          y="600"
          width="120"
          height="70"
          rx="5"
          fill="#152431"/>


    <rect x="380"
          y="615"
          width="80"
          height="35"
          fill="#58eaff"/>

  </g>


  <!-- Traditional torii merged with technology -->
  <g stroke="#e54c45"
     stroke-width="18"
     fill="none">

    <line x1="100"
          y1="600"
          x2="100"
          y2="760"/>

    <line x1="180"
          y1="600"
          x2="180"
          y2="760"/>

    <line x1="60"
          y1="600"
          x2="220"
          y2="600"/>

  </g>


  <!-- Data streams -->
  <g stroke="#80ffff"
     stroke-width="2"
     opacity="0.8">

    <line x1="70" y1="200" x2="70" y2="300"/>
    <line x1="100" y1="180" x2="100" y2="320"/>
    <line x1="530" y1="180" x2="530" y2="300"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="62"
        font-weight="bold"
        fill="#ffffff">
    KANTO
  </text>

  <text x="300"
        y="175"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="70"
        font-weight="bold"
        fill="#64eaff">
    DATA
  </text>


  <!-- Genre -->
  <text x="300"
        y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="6"
        fill="#b5ffff">
    GUIDE • THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="30"
        fill="#ffffff">
    Hiroshi Tanaka
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#9cefff">
    SORA PUBLISHING • 2023
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#5deaff"
        stroke-width="2"
        opacity="0.65"/>

</svg>