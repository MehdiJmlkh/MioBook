<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="atlanticSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#557b8c"/>
      <stop offset="45%" stop-color="#b9c9c2"/>
      <stop offset="100%" stop-color="#e6c58b"/>
    </linearGradient>

    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34788b"/>
      <stop offset="100%" stop-color="#082c3a"/>
    </linearGradient>

    <linearGradient id="cliffStone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a58c67"/>
      <stop offset="100%" stop-color="#40372d"/>
    </linearGradient>

    <linearGradient id="guidePaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2dfaa"/>
      <stop offset="100%" stop-color="#9d7642"/>
    </linearGradient>

  </defs>


  <!-- Irish coastal sky -->
  <rect width="600" height="900" fill="url(#atlanticSky)"/>


  <!-- Sun over Atlantic -->
  <circle cx="390"
          cy="250"
          r="55"
          fill="#f6d38a"
          opacity="0.7"/>


  <!-- Clouds -->
  <g fill="#ffffff"
     opacity="0.35">

    <ellipse cx="130" cy="220" rx="90" ry="25"/>
    <ellipse cx="480" cy="180" rx="100" ry="30"/>

  </g>


  <!-- Ocean -->
  <path d="
      M0 500
      L600 470
      L600 900
      L0 900Z"
      fill="url(#ocean)"/>


  <!-- Ocean waves -->
  <g fill="none"
     stroke="#9bd0d2"
     opacity="0.5">

    <path d="M0 600 Q150 570 300 600 Q450 630 600 590"/>
    <path d="M0 680 Q180 650 360 690 Q480 720 600 680"/>
    <path d="M0 760 Q200 730 400 780 Q520 810 600 770"/>

  </g>


  <!-- Cliffs of Clare -->
  <path d="
      M0 900
      L0 360
      Q90 390 160 500
      L240 460
      L330 600
      L430 520
      L600 650
      L600 900Z"
      fill="url(#cliffStone)"/>


  <!-- Cliff layers -->
  <g fill="none"
     stroke="#c3a77c"
     stroke-width="6"
     opacity="0.6">

    <path d="M20 520 Q120 480 230 560"/>
    <path d="M50 600 Q180 550 300 640"/>
    <path d="M100 700 Q260 640 430 730"/>

  </g>


  <!-- Lighthouse -->
  <g>

    <rect x="470"
          y="360"
          width="45"
          height="170"
          fill="#eee6d2"
          stroke="#54483b"
          stroke-width="4"/>


    <polygon points="
      460,360
      525,360
      492,320"
      fill="#c33d2e"/>


    <rect x="480"
          y="410"
          width="25"
          height="35"
          fill="#7fd4dc"/>

  </g>


  <!-- Walking path -->
  <path d="
      M250 900
      Q280 760 350 650
      Q400 580 470 540
      L500 580
      Q400 680 350 900Z"
      fill="#b89a68"/>


  <!-- Traveler -->
  <g>

    <circle cx="290"
            cy="650"
            r="24"
            fill="#161616"/>


    <path d="
        M250 900
        Q290 680 330 900Z"
        fill="#161616"/>


    <!-- backpack -->
    <rect x="320"
          y="700"
          width="45"
          height="90"
          rx="12"
          fill="#76502c"/>


    <!-- walking stick -->
    <line x1="245"
          y1="720"
          x2="190"
          y2="850"
          stroke="#67401e"
          stroke-width="7"/>

  </g>


  <!-- Guide book -->
  <g>

    <rect x="80"
          y="650"
          width="150"
          height="120"
          fill="url(#guidePaper)"
          transform="rotate(-10 80 650)"
          stroke="#684723"
          stroke-width="5"/>


    <!-- map -->
    <path d="
        M120 700
        Q160 670 200 720"
        fill="none"
        stroke="#80532b"
        stroke-width="4"/>


    <circle cx="160"
            cy="700"
            r="8"
            fill="#b33a2d"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="105"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="62"
        font-weight="bold"
        fill="#ffffff">
    CLIFFS OF
  </text>


  <text x="300"
        y="180"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="76"
        font-weight="bold"
        fill="#e6c47d">
    CLARE
  </text>


  <text x="300"
        y="235"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="28"
        letter-spacing="8"
        fill="#ffffff">
    GUIDE
  </text>


  <!-- Genre -->
  <text x="300"
        y="275"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="10"
        fill="#f3e3bc">
    TRAVEL • CULTURE
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Beatrix O'Malley
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#e8cc91">
    EMERALD HOUSE • 1980
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d3ae67"
        stroke-width="2"/>

</svg>