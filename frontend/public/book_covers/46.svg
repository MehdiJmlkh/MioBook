<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="forestMorning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8d7d0"/>
      <stop offset="35%" stop-color="#6e9b78"/>
      <stop offset="100%" stop-color="#1d3325"/>
    </linearGradient>

    <linearGradient id="trailGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b79563"/>
      <stop offset="100%" stop-color="#4c3523"/>
    </linearGradient>

    <linearGradient id="mapPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e7b9"/>
      <stop offset="100%" stop-color="#b99155"/>
    </linearGradient>

    <radialGradient id="sunLight">
      <stop offset="0%" stop-color="#fff2a6"/>
      <stop offset="100%" stop-color="#fff2a6" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

  </defs>


  <!-- Forest atmosphere -->
  <rect width="600" height="900" fill="url(#forestMorning)"/>


  <!-- Sun rays -->
  <ellipse cx="300"
           cy="220"
           rx="170"
           ry="120"
           fill="url(#sunLight)"
           filter="url(#soft)"/>


  <!-- Distant mountains -->
  <path d="
      M0 390
      L160 230
      L300 400
      L450 200
      L600 390
      L600 600
      L0 600Z"
      fill="#496a50"/>


  <!-- Cedar forest -->
  <g fill="#163322">

    <path d="
        M60 620
        L110 300
        L160 620Z"/>

    <path d="
        M180 650
        L240 240
        L300 650Z"/>

    <path d="
        M390 650
        L450 260
        L510 650Z"/>

    <path d="
        M500 620
        L550 340
        L590 620Z"/>

  </g>


  <!-- Trail -->
  <path d="
      M240 900
      Q300 700 350 520
      Q380 450 430 400
      Q300 470 190 400
      Q260 600 240 900Z"
      fill="url(#trailGround)"/>


  <!-- Wooden trail signs -->
  <g>

    <line x1="150"
          y1="520"
          x2="150"
          y2="720"
          stroke="#52321b"
          stroke-width="12"/>


    <rect x="70"
          y="500"
          width="160"
          height="55"
          rx="8"
          fill="#9b7041"
          transform="rotate(-8 70 500)"/>


    <text x="150"
          y="535"
          text-anchor="middle"
          font-family="Arial"
          font-size="16"
          fill="#f5e6b8">
      TRAIL 07
    </text>

  </g>


  <!-- Explorer backpack -->
  <g>

    <!-- person -->
    <circle cx="380"
            cy="560"
            r="30"
            fill="#20251d"/>


    <path d="
        M320 850
        Q380 600 450 700
        L500 850Z"
        fill="#20251d"/>


    <!-- backpack -->
    <rect x="410"
          y="650"
          width="70"
          height="120"
          rx="20"
          fill="#7b4b2c"/>

  </g>


  <!-- Open field notebook -->
  <g>

    <path d="
        M70 760
        L220 710
        L250 820
        L100 850Z"
        fill="url(#mapPaper)"/>


    <path d="
        M220 710
        L380 760
        L330 850
        L250 820Z"
        fill="#ead39a"/>


    <!-- map lines -->
    <g stroke="#82613b"
       stroke-width="3">

      <path d="
          M110 770
          Q160 730 210 770"/>

      <path d="
          M260 780
          Q310 750 350 790"/>

      <line x1="180"
            y1="750"
            x2="180"
            y2="820"/>

    </g>


    <!-- compass -->
    <circle cx="290"
            cy="810"
            r="22"
            fill="none"
            stroke="#80562e"
            stroke-width="3"/>

    <path d="
        M290 790
        L300 820
        L280 820Z"
        fill="#80562e"/>

  </g>


  <!-- Birds -->
  <g fill="none"
     stroke="#18251b"
     stroke-width="4">

    <path d="
        M120 250
        Q150 220 180 250
        Q150 235 120 250"/>

    <path d="
        M400 180
        Q430 150 460 180
        Q430 165 400 180"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="65"
        font-weight="bold"
        fill="#ffffff">
    CEDAR
  </text>

  <text x="300"
        y="175"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="70"
        font-weight="bold"
        fill="#e8d59a">
    TRAILS
  </text>


  <!-- Genre -->
  <text x="300"
        y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        letter-spacing="12"
        fill="#dce5c8">
    GUIDE
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="30"
        fill="#ffffff">
    Elara Vance
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#d7c995">
    MAPLE LEAF PRESS • 2023
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d7c68c"
        stroke-width="2"
        opacity="0.7"/>

</svg>