<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="japanNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090b16"/>
      <stop offset="50%" stop-color="#25233a"/>
      <stop offset="100%" stop-color="#7c2630"/>
    </linearGradient>

    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1d8a8"/>
      <stop offset="100%" stop-color="#8c633b"/>
    </linearGradient>

    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#303947"/>
      <stop offset="50%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>

    <radialGradient id="moonGlow">
      <stop offset="0%" stop-color="#fff0c2"/>
      <stop offset="100%" stop-color="#fff0c2" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

  </defs>


  <!-- Background -->
  <rect width="600" height="900" fill="url(#japanNight)"/>


  <!-- Moon -->
  <circle cx="430"
          cy="160"
          r="120"
          fill="url(#moonGlow)"
          filter="url(#softGlow)"/>

  <circle cx="430"
          cy="160"
          r="45"
          fill="#f5e7bd"/>


  <!-- Torii gate silhouette -->
  <g fill="#100b10">

    <rect x="90"
          y="390"
          width="25"
          height="240"/>

    <rect x="250"
          y="390"
          width="25"
          height="240"/>


    <rect x="45"
          y="360"
          width="280"
          height="35"/>


    <path d="
        M70 360
        Q185 250 300 360Z"/>

  </g>


  <!-- Cherry blossoms -->
  <g fill="#e8a9b7">

    <circle cx="100" cy="300" r="10"/>
    <circle cx="150" cy="260" r="8"/>
    <circle cx="210" cy="300" r="12"/>
    <circle cx="480" cy="330" r="10"/>
    <circle cx="520" cy="280" r="8"/>

  </g>


  <!-- Old scroll with hidden history -->
  <g>

    <rect x="350"
          y="360"
          width="150"
          height="240"
          rx="8"
          fill="url(#paper)"
          transform="rotate(8 350 360)"/>


    <line x1="390"
          y1="420"
          x2="470"
          y2="430"
          stroke="#5b3b20"
          stroke-width="5"/>

    <line x1="380"
          y1="460"
          x2="470"
          y2="470"
          stroke="#5b3b20"
          stroke-width="5"/>


    <!-- hidden symbol -->
    <circle cx="430"
            cy="520"
            r="35"
            fill="none"
            stroke="#8b1d2c"
            stroke-width="5"/>


    <path d="
        M410 520
        L430 490
        L450 520
        L430 550Z"
        fill="none"
        stroke="#8b1d2c"
        stroke-width="4"/>

  </g>


  <!-- Samurai shadow -->
  <g>

    <!-- helmet -->
    <path d="
        M190 520
        Q300 400 410 520
        L380 570
        L220 570Z"
        fill="url(#armor)"/>


    <!-- face mask -->
    <path d="
        M250 550
        Q300 520 350 550
        L340 650
        L260 650Z"
        fill="#080b10"/>


    <!-- body -->
    <path d="
        M140 870
        Q180 600 300 620
        Q420 600 460 870Z"
        fill="url(#armor)"/>


    <!-- armor plates -->
    <g stroke="#9b7b42"
       stroke-width="5">

      <line x1="210" y1="690" x2="390" y2="690"/>
      <line x1="190" y1="740" x2="410" y2="740"/>
      <line x1="180" y1="790" x2="420" y2="790"/>

    </g>


    <!-- katana -->
    <line x1="430"
          y1="500"
          x2="520"
          y2="820"
          stroke="#d8dbe2"
          stroke-width="6"/>


    <line x1="420"
          y1="600"
          x2="470"
          y2="580"
          stroke="#9b6b35"
          stroke-width="14"/>

  </g>


  <!-- Modern documents -->
  <g>

    <rect x="60"
          y="720"
          width="120"
          height="90"
          fill="#e5e1d2"
          transform="rotate(-12 60 720)"/>


    <rect x="75"
          y="735"
          width="90"
          height="8"
          fill="#252525"/>

    <rect x="75"
          y="760"
          width="70"
          height="8"
          fill="#252525"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="105"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="62"
        font-weight="bold"
        fill="#ffffff">
    HIDDEN
  </text>


  <text x="300"
        y="180"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="72"
        font-weight="bold"
        fill="#e6b3bc">
    SHOGUNATE
  </text>


  <!-- Genre -->
  <text x="300"
        y="230"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="7"
        fill="#f4d9a5">
    HISTORICAL • THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Hiroshi Tanaka
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#e8d0a5">
    SORA PUBLISHING • 2021
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d5b06a"
        stroke-width="2"/>

</svg>