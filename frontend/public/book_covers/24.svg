<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="lakeSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#142432"/>
      <stop offset="45%" stop-color="#557b76"/>
      <stop offset="100%" stop-color="#d9c48b"/>
    </linearGradient>

    <linearGradient id="lakeWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f8c91"/>
      <stop offset="100%" stop-color="#152f38"/>
    </linearGradient>

    <radialGradient id="mistLight">
      <stop offset="0%" stop-color="#f6e9b5"/>
      <stop offset="100%" stop-color="#f6e9b5" stop-opacity="0"/>
    </radialGradient>

    <filter id="fog">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

  </defs>


  <!-- Irish dawn sky -->
  <rect width="600" height="900" fill="url(#lakeSky)"/>


  <!-- Soft morning mist -->
  <ellipse cx="300"
           cy="330"
           rx="260"
           ry="120"
           fill="url(#mistLight)"
           filter="url(#fog)"/>


  <!-- Distant mountains -->
  <path d="
      M0 450
      L120 280
      L240 430
      L360 250
      L520 430
      L600 330
      L600 560
      L0 560Z"
      fill="#34483c"/>


  <!-- Old castle ruins -->
  <g fill="#55584c">

    <rect x="420"
          y="330"
          width="90"
          height="180"/>

    <polygon points="
        400,330
        465,250
        530,330"/>

    <rect x="445"
          y="390"
          width="35"
          height="70"
          fill="#1c2420"/>

  </g>


  <!-- Lake -->
  <path d="
      M0 540
      Q300 500 600 540
      L600 900
      L0 900Z"
      fill="url(#lakeWater)"/>


  <!-- Reflection -->
  <g opacity="0.35"
     fill="#d8c58c">

    <path d="
        M420 520
        L510 520
        L550 700
        L390 700Z"/>

  </g>


  <!-- Wooden boat -->
  <g>

    <path d="
        M180 650
        Q300 610 420 650
        L350 720
        L240 720Z"
        fill="#402719"/>

    <line x1="300"
          y1="630"
          x2="300"
          y2="480"
          stroke="#24160d"
          stroke-width="8"/>

    <!-- sail -->
    <path d="
        M300 490
        L300 620
        L410 600Z"
        fill="#e7d9af"/>

  </g>


  <!-- Water ripples -->
  <g fill="none"
     stroke="#b9e0df"
     opacity="0.45">

    <path d="
        M80 760
        Q180 730 280 760
        T500 760"
        stroke-width="5"/>

    <path d="
        M40 820
        Q180 790 360 820
        T580 820"
        stroke-width="4"/>

  </g>


  <!-- Folklore storyteller -->
  <g fill="#090d0c">

    <!-- head -->
    <circle cx="300"
            cy="580"
            r="20"/>


    <!-- cloak -->
    <path d="
        M250 630
        Q300 590 350 630
        L430 850
        L170 850Z"/>


    <!-- staff -->
    <line x1="220"
          y1="650"
          x2="160"
          y2="830"
          stroke="#15100b"
          stroke-width="10"/>

  </g>


  <!-- Ancient Celtic stone -->
  <g>

    <ellipse cx="120"
             cy="700"
             rx="45"
             ry="80"
             fill="#5b6556"/>


    <circle cx="120"
            cy="690"
            r="25"
            fill="none"
            stroke="#b69b55"
            stroke-width="4"/>


    <path d="
        M120 665
        Q150 690 120 715
        Q90 690 120 665"
        fill="none"
        stroke="#b69b55"
        stroke-width="3"/>

  </g>


  <!-- Floating legend symbols -->
  <g fill="#e2c777"
     opacity="0.7">

    <circle cx="500"
            cy="700"
            r="5"/>

    <circle cx="530"
            cy="740"
            r="4"/>

    <circle cx="90"
            cy="620"
            r="5"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="52"
        font-weight="bold"
        fill="#fff0c9">
    LAKESIDE
  </text>

  <text x="300"
        y="170"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="58"
        font-weight="bold"
        fill="#fff0c9">
    LEGENDS
  </text>


  <!-- Genre -->
  <text x="300"
        y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="6"
        fill="#d8d3ae">
    HISTORICAL
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="30"
        fill="#ffffff">
    Beatrix O'Malley
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#e5d09a">
    EMERALD HOUSE • 1988
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d7c17a"
        stroke-width="2"
        opacity="0.55"/>

</svg>