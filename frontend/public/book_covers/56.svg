<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="forestNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d0b"/>
      <stop offset="45%" stop-color="#26382a"/>
      <stop offset="100%" stop-color="#4a211d"/>
    </linearGradient>

    <linearGradient id="treeBark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1b120e"/>
      <stop offset="50%" stop-color="#4a2419"/>
      <stop offset="100%" stop-color="#160d0b"/>
    </linearGradient>

    <radialGradient id="redMist">
      <stop offset="0%" stop-color="#d44732" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d44732" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="oldStone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b2aa92"/>
      <stop offset="100%" stop-color="#514d45"/>
    </linearGradient>

    <filter id="mistBlur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

  </defs>


  <!-- Dark forest atmosphere -->
  <rect width="600" height="900" fill="url(#forestNight)"/>


  <!-- Red mysterious fog -->
  <ellipse cx="300"
           cy="350"
           rx="260"
           ry="180"
           fill="url(#redMist)"
           filter="url(#mistBlur)"/>


  <!-- Moon -->
  <circle cx="420"
          cy="150"
          r="55"
          fill="#e6d9b0"/>


  <!-- Distant trees -->
  <g fill="#142019">

    <path d="
        M60 600
        L120 260
        L180 600Z"/>

    <path d="
        M430 600
        L500 220
        L570 600Z"/>

    <path d="
        M200 600
        L270 300
        L340 600Z"/>

  </g>


  <!-- Ancient forest path -->
  <path d="
      M0 900
      Q250 650 300 500
      Q350 650 600 900Z"
      fill="#513827"/>


  <!-- Massive foreground trees -->
  <g>

    <path d="
        M40 900
        L70 150
        Q110 100 150 150
        L180 900Z"
        fill="url(#treeBark)"/>


    <path d="
        M450 900
        L470 180
        Q520 110 550 180
        L580 900Z"
        fill="url(#treeBark)"/>


    <!-- branches -->
    <g stroke="#24130e"
       stroke-width="18">

      <line x1="100" y1="300" x2="10" y2="220"/>
      <line x1="120" y1="400" x2="210" y2="280"/>
      <line x1="500" y1="330" x2="400" y2="240"/>
      <line x1="520" y1="420" x2="600" y2="330"/>

    </g>

  </g>


  <!-- Research equipment -->
  <g>

    <!-- lantern -->
    <rect x="265"
          y="560"
          width="70"
          height="100"
          rx="10"
          fill="#c78a35"
          stroke="#e9c36c"
          stroke-width="5"/>

    <rect x="280"
          y="585"
          width="40"
          height="45"
          fill="#ffd77a"/>


    <!-- notebook -->
    <rect x="390"
          y="650"
          width="120"
          height="80"
          fill="#8b6038"
          transform="rotate(12 390 650)"/>


    <line x1="420"
          y1="680"
          x2="490"
          y2="700"
          stroke="#e1c38b"
          stroke-width="4"/>

  </g>


  <!-- Researcher silhouette -->
  <g>

    <circle cx="300"
            cy="420"
            r="30"
            fill="#101411"/>


    <path d="
        M210 850
        Q270 450 350 500
        Q420 650 450 850Z"
        fill="#111713"/>


    <!-- backpack -->
    <rect x="240"
          y="570"
          width="80"
          height="140"
          rx="20"
          fill="#36402e"/>

  </g>


  <!-- Ancient carved stone -->
  <g>

    <path d="
        M80 720
        L170 650
        L230 720
        L190 810
        L100 800Z"
        fill="url(#oldStone)"/>


    <!-- mysterious symbol -->
    <circle cx="150"
            cy="730"
            r="35"
            fill="none"
            stroke="#8f1d1d"
            stroke-width="6"/>


    <path d="
        M130 730
        L150 700
        L170 730
        L150 760Z"
        fill="none"
        stroke="#8f1d1d"
        stroke-width="5"/>

  </g>


  <!-- Falling red leaves -->
  <g fill="#b52c22">

    <circle cx="210" cy="260" r="8"/>
    <circle cx="370" cy="320" r="10"/>
    <circle cx="260" cy="380" r="7"/>
    <circle cx="450" cy="430" r="9"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="75"
        font-weight="bold"
        fill="#ffffff">
    RED
  </text>


  <text x="300"
        y="185"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="75"
        font-weight="bold"
        fill="#d84a38">
    FOREST
  </text>


  <!-- Genre -->
  <text x="300"
        y="230"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="8"
        fill="#e6d4aa">
    THRILLER • HISTORIC
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Elara Vance
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#d8c49a">
    MAPLE LEAF PRESS • 2018
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#b54a3b"
        stroke-width="2"
        opacity="0.8"/>

</svg>