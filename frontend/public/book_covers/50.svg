<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="darkCity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d18"/>
      <stop offset="50%" stop-color="#252d3b"/>
      <stop offset="100%" stop-color="#8a6a4b"/>
    </linearGradient>

    <linearGradient id="oldLetter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2dfaa"/>
      <stop offset="100%" stop-color="#9b7440"/>
    </linearGradient>

    <linearGradient id="watchMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4d27a"/>
      <stop offset="50%" stop-color="#8b6427"/>
      <stop offset="100%" stop-color="#30200d"/>
    </linearGradient>

    <radialGradient id="lampGlow">
      <stop offset="0%" stop-color="#ffe9a0"/>
      <stop offset="100%" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurGlow">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

  </defs>


  <!-- Night city atmosphere -->
  <rect width="600" height="900" fill="url(#darkCity)"/>


  <!-- Street lamp glow -->
  <ellipse cx="460"
           cy="280"
           rx="150"
           ry="130"
           fill="url(#lampGlow)"
           filter="url(#blurGlow)"/>


  <!-- Old city buildings -->
  <g fill="#111824">

    <rect x="40"
          y="350"
          width="120"
          height="260"/>

    <rect x="190"
          y="280"
          width="150"
          height="330"/>

    <rect x="390"
          y="330"
          width="150"
          height="280"/>

  </g>


  <!-- Windows -->
  <g fill="#d7b86b">

    <rect x="80" y="390" width="18" height="25"/>
    <rect x="120" y="460" width="18" height="25"/>
    <rect x="230" y="360" width="20" height="30"/>
    <rect x="280" y="430" width="20" height="30"/>
    <rect x="440" y="410" width="20" height="30"/>

  </g>


  <!-- Rain -->
  <g stroke="#8395aa"
     opacity="0.4"
     stroke-width="3">

    <line x1="80" y1="150" x2="40" y2="280"/>
    <line x1="180" y1="120" x2="140" y2="260"/>
    <line x1="520" y1="130" x2="470" y2="280"/>
    <line x1="360" y1="150" x2="320" y2="290"/>

  </g>


  <!-- Suspicious silhouette -->
  <g fill="#080b11">

    <circle cx="250"
            cy="500"
            r="30"/>

    <path d="
        M170 850
        Q230 540 320 650
        L400 850Z"/>


    <!-- coat collar -->
    <path d="
        M220 580
        L250 520
        L280 580Z"
        fill="#1a2028"/>

  </g>


  <!-- Pocket watch -->
  <g>

    <!-- chain -->
    <path d="
        M330 480
        Q400 350 470 430"
        fill="none"
        stroke="#d3b05c"
        stroke-width="8"/>


    <!-- watch -->
    <circle cx="330"
            cy="520"
            r="100"
            fill="url(#watchMetal)"
            stroke="#f4d88c"
            stroke-width="8"/>


    <circle cx="330"
            cy="520"
            r="75"
            fill="#1b1b1b"
            stroke="#d8c07b"
            stroke-width="4"/>


    <!-- clock hands -->
    <line x1="330"
          y1="520"
          x2="330"
          y2="465"
          stroke="#f4d88c"
          stroke-width="6"/>


    <line x1="330"
          y1="520"
          x2="370"
          y2="540"
          stroke="#f4d88c"
          stroke-width="6"/>


    <circle cx="330"
            cy="520"
            r="8"
            fill="#f4d88c"/>

  </g>


  <!-- Hidden inheritance document -->
  <g>

    <rect x="80"
          y="620"
          width="170"
          height="130"
          rx="8"
          fill="url(#oldLetter)"
          transform="rotate(-10 80 620)"/>


    <!-- wax seal -->
    <circle cx="145"
            cy="710"
            r="22"
            fill="#8b2525"/>


    <path d="
        M120 670
        L210 650"
        stroke="#65451e"
        stroke-width="4"/>

    <path d="
        M110 695
        L200 680"
        stroke="#65451e"
        stroke-width="4"/>

  </g>


  <!-- Key symbol -->
  <g fill="#d5b36a">

    <circle cx="470"
            cy="650"
            r="25"
            fill="none"
            stroke="#d5b36a"
            stroke-width="8"/>

    <rect x="465"
          y="650"
          width="80"
          height="12"/>

    <rect x="510"
          y="662"
          width="12"
          height="25"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="65"
        font-weight="bold"
        fill="#ffffff">
    LEGACY
  </text>


  <text x="300"
        y="175"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="70"
        font-weight="bold"
        fill="#e8c978">
    WATCH
  </text>


  <!-- Genre -->
  <text x="300"
        y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        letter-spacing="12"
        fill="#d8c58e">
    THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="30"
        fill="#ffffff">
    Julian Thorne
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#d8c98c">
    STERLING PRESS • 2011
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d9bf78"
        stroke-width="2"
        opacity="0.7"/>

</svg>