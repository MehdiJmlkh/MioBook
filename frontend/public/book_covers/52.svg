<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="romanNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090b12"/>
      <stop offset="45%" stop-color="#3b2930"/>
      <stop offset="100%" stop-color="#b07a52"/>
    </linearGradient>

    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dcc4"/>
      <stop offset="100%" stop-color="#8b8070"/>
    </linearGradient>

    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0c66b"/>
      <stop offset="45%" stop-color="#a66a25"/>
      <stop offset="100%" stop-color="#38200c"/>
    </linearGradient>

    <radialGradient id="torchGlow">
      <stop offset="0%" stop-color="#ffd77a"/>
      <stop offset="100%" stop-color="#ff9d3c" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

  </defs>


  <!-- Dark Roman atmosphere -->
  <rect width="600" height="900" fill="url(#romanNight)"/>


  <!-- Torch light -->
  <ellipse cx="430"
           cy="250"
           rx="170"
           ry="140"
           fill="url(#torchGlow)"
           filter="url(#softGlow)"/>


  <!-- Moon -->
  <circle cx="120"
          cy="170"
          r="45"
          fill="#ded6b8"/>


  <!-- Roman columns -->
  <g fill="url(#marble)">

    <rect x="60"
          y="300"
          width="70"
          height="360"/>

    <rect x="470"
          y="300"
          width="70"
          height="360"/>


    <rect x="40"
          y="260"
          width="110"
          height="35"/>

    <rect x="450"
          y="260"
          width="110"
          height="35"/>


    <!-- cracks -->
    <g stroke="#776e60"
       stroke-width="5">

      <line x1="90" y1="360" x2="110" y2="430"/>
      <line x1="500" y1="410" x2="480" y2="500"/>

    </g>

  </g>


  <!-- Senate floor -->
  <path d="
      M0 600
      Q300 500 600 600
      L600 900
      L0 900Z"
      fill="#544137"/>


  <!-- Fallen laurel -->
  <g fill="#8e7a2e">

    <path d="
        M120 720
        Q180 650 250 700
        Q180 740 120 720Z"/>

    <path d="
        M250 700
        Q330 650 400 710
        Q320 740 250 700Z"/>

  </g>


  <!-- Brutus silhouette -->
  <g>

    <!-- head -->
    <circle cx="300"
            cy="420"
            r="45"
            fill="#101217"/>


    <!-- helmet -->
    <path d="
        M250 410
        Q300 340 350 410
        L340 430
        L260 430Z"
        fill="#b38a3c"/>


    <!-- cloak -->
    <path d="
        M170 850
        Q240 450 360 500
        Q450 600 470 850Z"
        fill="#151a20"/>


    <!-- red cloak inner -->
    <path d="
        M300 560
        Q360 620 390 850
        L300 850Z"
        fill="#7b2527"/>

  </g>


  <!-- Dagger of betrayal -->
  <g>

    <path d="
        M430 430
        L520 700"
        stroke="#d7d7c9"
        stroke-width="12"/>


    <path d="
        M410 440
        L460 450"
        stroke="#9c6b32"
        stroke-width="18"/>


    <circle cx="430"
            cy="430"
            r="15"
            fill="#c89b45"/>

  </g>


  <!-- Torn parchment -->
  <g>

    <path d="
        M70 560
        L220 520
        L240 670
        L90 700Z"
        fill="#d8bc82"/>


    <!-- Roman writing -->
    <g stroke="#765533"
       stroke-width="4">

      <line x1="110" y1="580" x2="190" y2="560"/>
      <line x1="110" y1="610" x2="200" y2="590"/>
      <line x1="120" y1="640" x2="190" y2="625"/>

    </g>


    <!-- blood mark -->
    <circle cx="180"
            cy="650"
            r="12"
            fill="#8e2025"/>

  </g>


  <!-- Broken statue head -->
  <g>

    <circle cx="500"
            cy="760"
            r="55"
            fill="#bdb4a2"/>

    <path d="
        M470 740
        L530 780"
        stroke="#777163"
        stroke-width="8"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="62"
        font-weight="bold"
        fill="#f2d08a">
    BRUTUS'
  </text>


  <text x="300"
        y="175"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="65"
        font-weight="bold"
        fill="#ffffff">
    PARADOX
  </text>


  <!-- Genre -->
  <text x="300"
        y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        letter-spacing="12"
        fill="#e2c98f">
    HISTORICAL
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="30"
        fill="#ffffff">
    Marcus Valerius
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#e5cf98">
    ROMA BOOKS • 2015
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d5b56c"
        stroke-width="2"
        opacity="0.7"/>

</svg>