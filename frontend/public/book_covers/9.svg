<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="irishSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101b16"/>
      <stop offset="45%" stop-color="#34543a"/>
      <stop offset="100%" stop-color="#b6a16b"/>
    </linearGradient>

    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#506b3c"/>
      <stop offset="100%" stop-color="#152217"/>
    </linearGradient>

    <radialGradient id="stormLight">
      <stop offset="0%" stop-color="#d9e6c5"/>
      <stop offset="100%" stop-color="#8fa57b" stop-opacity="0"/>
    </radialGradient>

    <filter id="mist">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

  </defs>


  <!-- Background -->
  <rect width="600" height="900" fill="url(#irishSky)"/>


  <!-- Storm light -->
  <ellipse cx="320" cy="260"
           rx="230"
           ry="140"
           fill="url(#stormLight)"
           filter="url(#mist)"/>


  <!-- Storm clouds -->
  <path d="
      M0 250
      Q120 140 260 220
      Q390 120 600 250
      L600 360
      Q400 300 0 360Z"
      fill="#121a18"
      opacity="0.65"/>


  <!-- Distant hills -->
  <path d="
      M0 500
      Q140 350 260 480
      Q400 300 600 500
      L600 900
      L0 900Z"
      fill="#263b28"/>


  <!-- Old castle -->
  <g fill="#1a211a">

    <rect x="350" y="400" width="150" height="220"/>

    <rect x="380" y="320" width="45" height="300"/>
    <rect x="460" y="350" width="40" height="270"/>

    <polygon points="370,320 402,250 435,320"/>
    <polygon points="450,350 480,290 510,350"/>

  </g>


  <!-- Castle windows -->
  <g fill="#e4b76a">
    <rect x="395" y="390" width="12" height="25"/>
    <rect x="475" y="420" width="12" height="25"/>
    <rect x="420" y="500" width="12" height="25"/>
  </g>


  <!-- Foreground field -->
  <path d="
      M0 650
      Q160 580 300 680
      Q450 580 600 670
      L600 900
      L0 900Z"
      fill="url(#field)"/>


  <!-- Rebel flag -->
  <g>

    <rect x="170" y="470"
          width="8"
          height="260"
          fill="#151515"/>

    <path d="
        M178 480
        Q250 450 320 500
        L178 570Z"
        fill="#203f30"/>

    <path d="
        M178 500
        Q250 480 320 520
        L178 550Z"
        fill="#b6a34b"/>

  </g>


  <!-- Family silhouette -->
  <g fill="#080b09">

    <circle cx="300" cy="560" r="18"/>

    <path d="
        M260 620
        Q300 570 340 620
        L355 760
        L245 760Z"/>


    <circle cx="250" cy="600" r="12"/>
    <path d="
        M225 650
        Q250 610 275 650
        L280 760
        L220 760Z"/>


    <circle cx="360" cy="600" r="12"/>
    <path d="
        M335 650
        Q360 610 385 650
        L390 760
        L330 760Z"/>

  </g>


  <!-- Rain -->
  <g stroke="#9fb8a2" opacity="0.45">

    <line x1="80" y1="300" x2="60" y2="390"/>
    <line x1="140" y1="250" x2="120" y2="340"/>
    <line x1="520" y1="280" x2="500" y2="370"/>
    <line x1="560" y1="360" x2="540" y2="450"/>

  </g>


  <!-- Title -->
  <text x="300" y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="54"
        font-weight="bold"
        fill="#f1e4b8">
    EMERALD
  </text>

  <text x="300" y="170"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="54"
        font-weight="bold"
        fill="#f1e4b8">
    STORM
  </text>


  <!-- Genre -->
  <text x="300" y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        letter-spacing="6"
        fill="#d8d0a6">
    A HISTORICAL TALE
  </text>


  <!-- Author -->
  <text x="300" y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="30"
        fill="#ffffff">
    Beatrix O'Malley
  </text>


  <!-- Publisher -->
  <text x="300" y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#d8cda5">
    EMERALD HOUSE • 1985
  </text>


  <!-- Border -->
  <rect x="22" y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d8c17a"
        stroke-width="2"
        opacity="0.45"/>

</svg>