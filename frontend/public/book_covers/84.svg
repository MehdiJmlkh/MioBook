<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="cyberSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08051c"/>
      <stop offset="45%" stop-color="#24144b"/>
      <stop offset="100%" stop-color="#071d2b"/>
    </linearGradient>

    <linearGradient id="waterGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12495b"/>
      <stop offset="100%" stop-color="#030b13"/>
    </linearGradient>

    <linearGradient id="metalShip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#596873"/>
      <stop offset="100%" stop-color="#171d25"/>
    </linearGradient>

    <filter id="neonBlur">
      <feGaussianBlur stdDeviation="15"/>
    </filter>

  </defs>


  <!-- Futuristic night sky -->
  <rect width="600" height="900" fill="url(#cyberSky)"/>


  <!-- Neon atmosphere -->
  <g filter="url(#neonBlur)" opacity="0.55">

    <rect x="80"
          y="200"
          width="180"
          height="20"
          fill="#00e5ff"/>

    <rect x="340"
          y="260"
          width="170"
          height="25"
          fill="#ff2ca8"/>

    <circle cx="300"
            cy="350"
            r="80"
            fill="#8338ec"/>

  </g>


  <!-- Floating city skyline -->
  <g fill="#101522">

    <rect x="40"
          y="350"
          width="80"
          height="250"/>

    <rect x="150"
          y="280"
          width="110"
          height="320"/>

    <rect x="300"
          y="330"
          width="90"
          height="270"/>

    <rect x="430"
          y="240"
          width="120"
          height="360"/>

  </g>


  <!-- Neon building windows -->
  <g fill="#00d9ff">

    <rect x="70" y="390" width="25" height="8"/>
    <rect x="70" y="430" width="40" height="8"/>
    <rect x="180" y="340" width="45" height="8"/>
    <rect x="180" y="390" width="30" height="8"/>

  </g>

  <g fill="#ff4fa3">

    <rect x="460" y="300" width="50" height="10"/>
    <rect x="460" y="350" width="35" height="10"/>
    <rect x="330" y="390" width="45" height="10"/>

  </g>


  <!-- Harbor water -->
  <path d="
      M0 600
      L600 600
      L600 900
      L0 900Z"
      fill="url(#waterGlow)"/>


  <!-- Reflections -->
  <g opacity="0.6">

    <path d="
      M120 600
      L170 600
      L210 900
      L80 900Z"
      fill="#00c8e8"/>

    <path d="
      M450 600
      L500 600
      L560 900
      L400 900Z"
      fill="#ff299b"/>

  </g>


  <!-- Smuggler ship -->
  <g>

    <path d="
        M150 650
        Q300 740 470 650
        L420 800
        L210 800Z"
        fill="url(#metalShip)"
        stroke="#090d14"
        stroke-width="8"/>


    <!-- cargo containers -->
    <rect x="240"
          y="620"
          width="100"
          height="70"
          fill="#263947"
          stroke="#00d9ff"
          stroke-width="4"/>


    <rect x="355"
          y="640"
          width="70"
          height="50"
          fill="#47263e"
          stroke="#ff4fa3"
          stroke-width="4"/>


    <!-- antenna -->
    <line x1="300"
          y1="620"
          x2="300"
          y2="510"
          stroke="#b8d7df"
          stroke-width="5"/>


    <circle cx="300"
            cy="500"
            r="12"
            fill="#00eaff"/>

  </g>


  <!-- Detective silhouette -->
  <g>

    <circle cx="105"
            cy="680"
            r="25"
            fill="#05080d"/>


    <path d="
        M55 900
        Q105 700 155 900Z"
        fill="#05080d"/>


    <!-- coat collar -->
    <path d="
        M80 720
        L105 770
        L130 720"
        fill="#222b34"/>


    <!-- flashlight -->
    <line x1="145"
          y1="760"
          x2="220"
          y2="700"
          stroke="#d9c57c"
          stroke-width="6"/>


    <circle cx="225"
            cy="695"
            r="15"
            fill="#ffe8a1"/>

  </g>


  <!-- Floating holographic clue -->
  <g>

    <polygon points="
      500,520
      550,550
      500,580
      450,550"
      fill="none"
      stroke="#00eaff"
      stroke-width="4"/>


    <circle cx="500"
            cy="550"
            r="8"
            fill="#ff2ca8"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="105"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="82"
        font-weight="bold"
        fill="#ffffff">
    NEON
  </text>


  <text x="300"
        y="190"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="82"
        font-weight="bold"
        fill="#00eaff">
    HARBOR
  </text>


  <!-- Genre -->
  <text x="300"
        y="240"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="12"
        fill="#ff9bd0">
    THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Hiroshi Tanaka
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#80eaff">
    SORA PUBLISHING • 2018
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#00d9ff"
        stroke-width="2"/>

</svg>