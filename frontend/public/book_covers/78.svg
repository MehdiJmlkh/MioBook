<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="romanNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090b12"/>
      <stop offset="50%" stop-color="#30251d"/>
      <stop offset="100%" stop-color="#b0834e"/>
    </linearGradient>

    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eee3c9"/>
      <stop offset="100%" stop-color="#8c7b60"/>
    </linearGradient>

    <linearGradient id="scroll" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5df9d"/>
      <stop offset="100%" stop-color="#9d7138"/>
    </linearGradient>

    <filter id="torchGlow">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

  </defs>


  <!-- Roman evening sky -->
  <rect width="600" height="900" fill="url(#romanNight)"/>


  <!-- Torch glow -->
  <circle cx="470"
          cy="330"
          r="120"
          fill="#e8b45d"
          opacity="0.25"
          filter="url(#torchGlow)"/>


  <!-- Moon -->
  <circle cx="120"
          cy="150"
          r="45"
          fill="#e5d8ad"
          opacity="0.7"/>


  <!-- Ancient forum background -->
  <g fill="#181411">

    <!-- columns -->
    <rect x="80"
          y="310"
          width="35"
          height="250"/>

    <rect x="180"
          y="280"
          width="35"
          height="280"/>

    <rect x="390"
          y="290"
          width="35"
          height="270"/>

    <rect x="490"
          y="330"
          width="35"
          height="230"/>

  </g>


  <!-- Column tops -->
  <g fill="#a89a7c">

    <rect x="65" y="300" width="65" height="20"/>
    <rect x="165" y="270" width="65" height="20"/>
    <rect x="375" y="280" width="65" height="20"/>
    <rect x="475" y="320" width="65" height="20"/>

  </g>


  <!-- Forum floor -->
  <path d="
      M0 560
      L600 560
      L600 900
      L0 900Z"
      fill="url(#marble)"/>


  <!-- Marble cracks -->
  <g stroke="#88775e"
     stroke-width="3">

    <path d="M100 620 L160 680 L130 760"/>
    <path d="M400 600 L350 720 L430 820"/>
    <path d="M250 650 L300 740 L270 850"/>

  </g>


  <!-- Secret meeting table -->
  <g>

    <ellipse cx="300"
             cy="560"
             rx="130"
             ry="35"
             fill="#3a2518"/>

    <rect x="285"
          y="500"
          width="30"
          height="60"
          fill="#51341f"/>


    <!-- hidden documents -->
    <rect x="240"
          y="515"
          width="80"
          height="45"
          fill="url(#scroll)"
          transform="rotate(-8 240 515)"/>


    <line x1="260"
          y1="535"
          x2="300"
          y2="535"
          stroke="#6b4928"
          stroke-width="3"/>

  </g>


  <!-- Senator silhouette -->
  <g>

    <!-- head -->
    <circle cx="300"
            cy="400"
            r="28"
            fill="#161311"/>


    <!-- toga -->
    <path d="
        M230 900
        Q250 450 300 430
        Q350 450 370 900Z"
        fill="#ded6c4"/>


    <!-- toga folds -->
    <g stroke="#8c816e"
       stroke-width="5">

      <path d="M270 520 L250 800"/>
      <path d="M330 520 L350 800"/>

    </g>

  </g>


  <!-- Whispering figures -->
  <g fill="#11100e">

    <circle cx="170" cy="520" r="20"/>
    <path d="M140 900 Q170 540 200 900Z"/>

    <circle cx="430" cy="520" r="20"/>
    <path d="M400 900 Q430 540 460 900Z"/>

  </g>


  <!-- Torch -->
  <g>

    <rect x="465"
          y="430"
          width="12"
          height="120"
          fill="#6a4221"/>

    <path d="
        M471 430
        Q450 380 471 350
        Q492 380 471 430Z"
        fill="#ffbd54"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="105"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="68"
        font-weight="bold"
        fill="#ffffff">
    FORUM
  </text>


  <text x="300"
        y="180"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="70"
        font-weight="bold"
        fill="#d7b16b">
    CONSPIRACY
  </text>


  <!-- Genre -->
  <text x="300"
        y="230"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="8"
        fill="#e7d8b6">
    HISTORICAL • THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Marcus Valerius
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#ddc18b">
    ROMA BOOKS • 2012
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#c29b57"
        stroke-width="2"/>

</svg>