<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="londonNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#263647"/>
      <stop offset="100%" stop-color="#b48a62"/>
    </linearGradient>

    <linearGradient id="glassTower" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7f1f3"/>
      <stop offset="40%" stop-color="#6da0ad"/>
      <stop offset="100%" stop-color="#24343d"/>
    </linearGradient>

    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21485b"/>
      <stop offset="100%" stop-color="#07131d"/>
    </linearGradient>

    <radialGradient id="harborLight">
      <stop offset="0%" stop-color="#ffd98b"/>
      <stop offset="100%" stop-color="#ffd98b" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

  </defs>


  <!-- Background -->
  <rect width="600" height="900" fill="url(#londonNight)"/>


  <!-- Fog -->
  <ellipse cx="300"
           cy="360"
           rx="280"
           ry="130"
           fill="#cbd7d5"
           opacity="0.12"
           filter="url(#blur)"/>


  <!-- Harbor light -->
  <ellipse cx="430"
           cy="350"
           rx="160"
           ry="130"
           fill="url(#harborLight)"
           filter="url(#blur)"/>


  <!-- Moon -->
  <circle cx="130"
          cy="150"
          r="45"
          fill="#e8dfc0"/>


  <!-- London skyline -->
  <g fill="#121d26">

    <rect x="40"
          y="360"
          width="90"
          height="220"/>

    <rect x="160"
          y="300"
          width="110"
          height="280"/>

    <rect x="430"
          y="330"
          width="100"
          height="250"/>

  </g>


  <!-- Glass building -->
  <g>

    <path d="
        M270 560
        L320 180
        L400 560Z"
        fill="url(#glassTower)"
        stroke="#bde4e8"
        stroke-width="3"/>


    <!-- glass reflections -->
    <g stroke="#e8ffff"
       opacity="0.45">

      <line x1="330" y1="250" x2="350" y2="500"/>
      <line x1="360" y1="230" x2="380" y2="500"/>

    </g>


    <!-- windows -->
    <g fill="#1b3543">

      <rect x="340" y="290" width="20" height="35"/>
      <rect x="345" y="350" width="20" height="35"/>
      <rect x="350" y="410" width="20" height="35"/>

    </g>

  </g>


  <!-- Thames river -->
  <path d="
      M0 610
      Q180 530 300 610
      Q450 690 600 580
      L600 900
      L0 900Z"
      fill="url(#river)"/>


  <!-- Reflections -->
  <g stroke="#9ac2cc"
     opacity="0.3">

    <line x1="300" y1="620" x2="340" y2="850"/>
    <line x1="350" y1="620" x2="390" y2="820"/>

  </g>


  <!-- Smuggler boat -->
  <g>

    <path d="
        M90 700
        Q180 650 290 700
        L230 760
        L130 750Z"
        fill="#171d21"/>


    <!-- hidden cargo -->
    <rect x="150"
          y="670"
          width="80"
          height="50"
          fill="#73502e"/>


    <!-- mast -->
    <line x1="190"
          y1="660"
          x2="190"
          y2="560"
          stroke="#6e5335"
          stroke-width="6"/>


    <!-- sail -->
    <path d="
        M190 570
        L270 650
        L190 650Z"
        fill="#c8c5aa"/>

  </g>


  <!-- Detective silhouette -->
  <g>

    <circle cx="450"
            cy="580"
            r="28"
            fill="#090d11"/>


    <path d="
        M380 850
        Q430 620 500 650
        Q540 760 570 850Z"
        fill="#0a1015"/>


    <!-- coat line -->
    <line x1="450"
          y1="650"
          x2="450"
          y2="850"
          stroke="#303942"
          stroke-width="5"/>

  </g>


  <!-- Evidence folder -->
  <g>

    <rect x="60"
          y="760"
          width="150"
          height="90"
          fill="#b58a52"
          transform="rotate(-8 60 760)"/>


    <line x1="90"
          y1="790"
          x2="180"
          y2="780"
          stroke="#49331e"
          stroke-width="5"/>

    <line x1="90"
          y1="820"
          x2="170"
          y2="810"
          stroke="#49331e"
          stroke-width="5"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="62"
        font-weight="bold"
        fill="#ffffff">
    HARBOR
  </text>


  <text x="300"
        y="180"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="72"
        font-weight="bold"
        fill="#bce8ed">
    OF GLASS
  </text>


  <!-- Genre -->
  <text x="300"
        y="230"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        letter-spacing="12"
        fill="#e5d6ad">
    THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Julian Thorne
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#c9dce0">
    STERLING PRESS • 2006
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#b9d9df"
        stroke-width="2"
        opacity="0.8"/>

</svg>