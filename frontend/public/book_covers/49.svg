<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="irishMist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c7d4c5"/>
      <stop offset="45%" stop-color="#738c70"/>
      <stop offset="100%" stop-color="#26392d"/>
    </linearGradient>

    <linearGradient id="stoneWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#aaa58c"/>
      <stop offset="100%" stop-color="#4c5146"/>
    </linearGradient>

    <linearGradient id="oldMap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3e3b2"/>
      <stop offset="100%" stop-color="#b48a54"/>
    </linearGradient>

    <radialGradient id="softSun">
      <stop offset="0%" stop-color="#fff1b0"/>
      <stop offset="100%" stop-color="#fff1b0" stop-opacity="0"/>
    </radialGradient>

    <filter id="mist">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

  </defs>


  <!-- Irish countryside -->
  <rect width="600" height="900" fill="url(#irishMist)"/>


  <!-- Morning light -->
  <ellipse cx="350"
           cy="220"
           rx="180"
           ry="120"
           fill="url(#softSun)"
           filter="url(#mist)"/>


  <!-- Rolling hills -->
  <path d="
      M0 430
      Q150 280 300 420
      Q450 260 600 430
      L600 650
      L0 650Z"
      fill="#496348"/>


  <!-- Ancient stone ruins -->
  <g>

    <!-- ruined tower -->
    <path d="
        M150 650
        L150 300
        L330 240
        L330 650Z"
        fill="url(#stoneWall)"/>


    <!-- broken top -->
    <path d="
        M150 300
        L190 260
        L230 300
        L280 230
        L330 260
        L330 320Z"
        fill="#67675a"/>


    <!-- stone blocks -->
    <g stroke="#777563"
       stroke-width="8">

      <line x1="170" y1="380" x2="310" y2="380"/>
      <line x1="160" y1="460" x2="320" y2="460"/>
      <line x1="160" y1="540" x2="320" y2="540"/>

    </g>


    <!-- moss patches -->
    <g fill="#527044">

      <path d="
          M180 330
          Q240 300 300 330
          L280 370
          L190 360Z"/>

      <path d="
          M160 500
          Q230 470 290 510
          L250 540
          L170 530Z"/>

    </g>

  </g>


  <!-- Ancient pathway -->
  <path d="
      M250 900
      Q280 700 320 560
      Q350 480 410 420
      Q300 500 160 420
      Q220 650 250 900Z"
      fill="#8a704e"/>


  <!-- Stone path pieces -->
  <g fill="#b5aa8b">

    <ellipse cx="260" cy="760" rx="60" ry="25"/>
    <ellipse cx="310" cy="690" rx="55" ry="22"/>
    <ellipse cx="350" cy="620" rx="45" ry="18"/>

  </g>


  <!-- Guide explorer -->
  <g>

    <!-- head -->
    <circle cx="430"
            cy="520"
            r="28"
            fill="#1b211d"/>


    <!-- coat -->
    <path d="
        M360 850
        Q420 560 500 700
        L560 850Z"
        fill="#202b24"/>


    <!-- walking stick -->
    <line x1="500"
          y1="560"
          x2="560"
          y2="850"
          stroke="#704d2a"
          stroke-width="8"/>


    <!-- backpack -->
    <rect x="370"
          y="620"
          width="70"
          height="120"
          rx="20"
          fill="#805735"/>

  </g>


  <!-- Open historical map -->
  <g>

    <path d="
        M70 730
        L200 690
        L250 820
        L110 850Z"
        fill="url(#oldMap)"/>


    <path d="
        M200 690
        L340 720
        L300 850
        L250 820Z"
        fill="#e9d19a"/>


    <!-- map markings -->
    <g stroke="#755738"
       stroke-width="3">

      <path d="
          M120 760
          Q160 720 210 760"/>

      <path d="
          M230 750
          Q270 730 310 770"/>

      <line x1="180"
            y1="720"
            x2="180"
            y2="810"/>

    </g>


    <!-- compass -->
    <circle cx="245"
            cy="790"
            r="22"
            fill="none"
            stroke="#6e4d2b"
            stroke-width="4"/>

    <path d="
        M245 770
        L255 805
        L235 805Z"
        fill="#6e4d2b"/>

  </g>


  <!-- Wild plants -->
  <g fill="#405b36">

    <path d="
        M80 650
        Q100 520 120 650Z"/>

    <path d="
        M520 680
        Q540 530 560 680Z"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="65"
        font-weight="bold"
        fill="#ffffff">
    MOSS
  </text>

  <text x="300"
        y="175"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="70"
        font-weight="bold"
        fill="#d7d09b">
    &amp; STONE
  </text>


  <!-- Genre -->
  <text x="300"
        y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="7"
        fill="#e4dfbd">
    GUIDE • HISTORICAL
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="30"
        fill="#ffffff">
    Beatrix O'Malley
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#d8cf9c">
    EMERALD HOUSE • 1989
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d8ce91"
        stroke-width="2"
        opacity="0.7"/>

</svg>