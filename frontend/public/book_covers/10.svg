<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="cyberNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#101d38"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2b44"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>

    <radialGradient id="screenGlow">
      <stop offset="0%" stop-color="#43e8ff"/>
      <stop offset="45%" stop-color="#1479a8"/>
      <stop offset="100%" stop-color="#00141f" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="15"/>
    </filter>

  </defs>


  <!-- Background -->
  <rect width="600" height="900" fill="url(#cyberNight)"/>


  <!-- Digital grid -->
  <g stroke="#1c6a8a" opacity="0.25">

    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="380" x2="600" y2="380"/>
    <line x1="0" y1="460" x2="600" y2="460"/>

    <line x1="100" y1="250" x2="100" y2="600"/>
    <line x1="220" y1="250" x2="220" y2="600"/>
    <line x1="380" y1="250" x2="380" y2="600"/>
    <line x1="500" y1="250" x2="500" y2="600"/>

  </g>


  <!-- Neon glow -->
  <ellipse cx="300" cy="400"
           rx="220"
           ry="180"
           fill="url(#screenGlow)"
           filter="url(#blur)"/>


  <!-- City skyline -->
  <g fill="url(#city)">

    <rect x="40" y="420" width="80" height="230"/>
    <rect x="150" y="350" width="100" height="300"/>
    <rect x="290" y="390" width="120" height="260"/>
    <rect x="450" y="330" width="90" height="320"/>

  </g>


  <!-- Building lights -->
  <g fill="#43d9ff">

    <rect x="70" y="470" width="12" height="18"/>
    <rect x="70" y="520" width="12" height="18"/>
    <rect x="190" y="410" width="12" height="20"/>
    <rect x="220" y="460" width="12" height="20"/>
    <rect x="330" y="440" width="12" height="20"/>
    <rect x="480" y="390" width="12" height="20"/>

  </g>


  <!-- Digital lock / protocol symbol -->
  <g fill="none" stroke="#53e7ff" stroke-width="5">

    <rect x="210" y="270" width="180" height="140"
          rx="20"/>

    <circle cx="300" cy="340" r="35"/>

    <line x1="300" y1="305" x2="300" y2="375"/>

    <line x1="265" y1="340" x2="335" y2="340"/>

  </g>


  <!-- Spy silhouette -->
  <g fill="#020409">

    <circle cx="300" cy="570" r="20"/>

    <path d="
        M250 720
        Q300 600 350 720
        L380 830
        L220 830Z"/>

    <!-- coat -->
    <path d="
        M270 680
        L330 680
        L350 830
        L250 830Z"/>

    <!-- gun -->
    <rect x="370" y="700"
          width="80"
          height="12"
          transform="rotate(-10 370 700)"/>

  </g>


  <!-- Binary code -->
  <g fill="#4be4ff"
     font-family="monospace"
     font-size="14"
     opacity="0.45">

    <text x="50" y="760">01010110</text>
    <text x="410" y="790">10100101</text>
    <text x="80" y="820">11001001</text>

  </g>


  <!-- Title -->
  <text x="300" y="105"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="50"
        font-weight="bold"
        letter-spacing="3"
        fill="#ffffff">
    MIDNIGHT
  </text>

  <text x="300" y="165"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="50"
        font-weight="bold"
        letter-spacing="3"
        fill="#43e8ff">
    PROTOCOL
  </text>


  <!-- Genre -->
  <text x="300" y="220"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        letter-spacing="7"
        fill="#b5dce8">
    A THRILLER
  </text>


  <!-- Author -->
  <text x="300" y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="30"
        fill="#ffffff">
    Julian Thorne
  </text>


  <!-- Publisher -->
  <text x="300" y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#9bd2e5">
    STERLING PRESS • 2001
  </text>


  <!-- Border -->
  <rect x="22" y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#4bdcff"
        stroke-width="2"
        opacity="0.45"/>

</svg>