<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="japanSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17324a"/>
      <stop offset="45%" stop-color="#7bb7c7"/>
      <stop offset="100%" stop-color="#f2d69a"/>
    </linearGradient>

    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d7187"/>
      <stop offset="100%" stop-color="#092b3a"/>
    </linearGradient>

    <linearGradient id="paperMap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4dfae"/>
      <stop offset="100%" stop-color="#b98b4d"/>
    </linearGradient>

    <filter id="sunGlow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

  </defs>


  <!-- Coastal sunrise -->
  <rect width="600" height="900" fill="url(#japanSky)"/>


  <!-- Rising sun -->
  <circle cx="430"
          cy="270"
          r="75"
          fill="#ffcf79"
          opacity="0.35"
          filter="url(#sunGlow)"/>

  <circle cx="430"
          cy="270"
          r="45"
          fill="#f6b85f"/>


  <!-- Distant Japanese islands -->
  <path d="
      M0 430
      Q120 350 220 420
      Q330 340 600 430
      L600 520
      L0 520Z"
      fill="#354c54"/>


  <!-- Ocean -->
  <path d="
      M0 500
      L600 500
      L600 900
      L0 900Z"
      fill="url(#sea)"/>


  <!-- Waves -->
  <g fill="none"
     stroke="#9bd4dc"
     stroke-width="4"
     opacity="0.6">

    <path d="M0 600 Q150 570 300 600 Q450 630 600 590"/>
    <path d="M0 680 Q200 650 400 700 Q500 720 600 690"/>
    <path d="M0 780 Q150 740 350 790 Q500 820 600 770"/>

  </g>


  <!-- Coastal village -->
  <g fill="#20282b">

    <path d="
        M70 540
        L150 480
        L230 540Z"/>

    <rect x="95"
          y="540"
          width="110"
          height="70"/>


    <path d="
        M300 540
        L390 470
        L480 540Z"/>

    <rect x="330"
          y="540"
          width="120"
          height="70"/>

  </g>


  <!-- Torii gate -->
  <g>

    <rect x="480"
          y="390"
          width="15"
          height="130"
          fill="#b43d2c"/>

    <rect x="550"
          y="390"
          width="15"
          height="130"
          fill="#b43d2c"/>


    <rect x="455"
          y="375"
          width="135"
          height="15"
          fill="#c64b37"/>


    <path d="
        M445 375
        Q525 330 600 375"
        fill="none"
        stroke="#c64b37"
        stroke-width="12"/>

  </g>


  <!-- Atlas book/map -->
  <g>

    <path d="
        M80 720
        L260 650
        L300 800
        L120 840Z"
        fill="url(#paperMap)"
        stroke="#694725"
        stroke-width="5"/>


    <path d="
        M300 800
        L460 730
        L500 850
        L120 840Z"
        fill="#d6b77c"
        stroke="#694725"
        stroke-width="5"/>


    <!-- map routes -->
    <g fill="none"
       stroke="#8b4a2b"
       stroke-width="4">

      <path d="M150 780 Q220 720 280 760"/>
      <path d="M330 790 Q400 750 450 800"/>

    </g>


    <circle cx="220"
            cy="760"
            r="10"
            fill="#c43b2d"/>

    <circle cx="400"
            cy="780"
            r="10"
            fill="#c43b2d"/>

  </g>


  <!-- Traveler silhouette -->
  <g>

    <circle cx="330"
            cy="560"
            r="22"
            fill="#111"/>


    <path d="
        M300 720
        Q330 590 360 720Z"
        fill="#111"/>


    <!-- camera -->
    <rect x="350"
          y="630"
          width="45"
          height="25"
          fill="#252525"/>

    <circle cx="390"
            cy="642"
            r="8"
            fill="#b9dce0"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="105"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="76"
        font-weight="bold"
        fill="#ffffff">
    SHORELINE
  </text>


  <text x="300"
        y="185"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="82"
        font-weight="bold"
        fill="#f5c56d">
    ATLAS
  </text>


  <!-- Genre -->
  <text x="300"
        y="235"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="12"
        fill="#ffffff">
    GUIDE
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Hiroshi Tanaka
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#f2cf82">
    SORA PUBLISHING • 2017
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#e1b968"
        stroke-width="2"/>

</svg>