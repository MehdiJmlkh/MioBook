<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="irishDusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182b28"/>
      <stop offset="45%" stop-color="#526b52"/>
      <stop offset="100%" stop-color="#d0b27a"/>
    </linearGradient>

    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#163b42"/>
      <stop offset="50%" stop-color="#7da3a0"/>
      <stop offset="100%" stop-color="#19363b"/>
    </linearGradient>

    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b8b72"/>
      <stop offset="100%" stop-color="#3d3934"/>
    </linearGradient>

    <radialGradient id="lanternGlow">
      <stop offset="0%" stop-color="#ffd982"/>
      <stop offset="100%" stop-color="#ffd982" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

  </defs>


  <!-- Background -->
  <rect width="600" height="900" fill="url(#irishDusk)"/>


  <!-- Mist -->
  <ellipse cx="300"
           cy="370"
           rx="260"
           ry="130"
           fill="#dce6d5"
           opacity="0.25"
           filter="url(#blur)"/>


  <!-- Old moon -->
  <circle cx="120"
          cy="150"
          r="55"
          fill="#e8dcb4"/>


  <!-- Distant hills -->
  <path d="
      M0 450
      Q130 280 260 430
      Q400 250 600 440
      L600 600
      L0 600Z"
      fill="#314b3b"/>


  <!-- Ancient oak tree -->
  <g>

    <path d="
        M80 650
        Q130 300 200 250
        Q250 330 220 650Z"
        fill="#30231a"/>


    <g fill="#203d2b">

      <circle cx="130" cy="270" r="70"/>
      <circle cx="200" cy="290" r="80"/>
      <circle cx="160" cy="220" r="55"/>

    </g>


    <!-- branches -->
    <g stroke="#25180f"
       stroke-width="12">

      <line x1="160" y1="350" x2="40" y2="260"/>
      <line x1="170" y1="380" x2="280" y2="270"/>

    </g>

  </g>


  <!-- River -->
  <path d="
      M0 560
      Q180 500 350 580
      Q470 650 600 550
      L600 900
      L0 900Z"
      fill="url(#river)"/>


  <!-- River reflections -->
  <g stroke="#d5d0a8"
     opacity="0.35">

    <line x1="250" y1="620" x2="270" y2="850"/>
    <line x1="310" y1="620" x2="350" y2="880"/>
    <line x1="380" y1="650" x2="430" y2="830"/>

  </g>


  <!-- Stone bridge -->
  <g>

    <path d="
        M220 570
        Q300 470 380 570
        L380 650
        L220 650Z"
        fill="url(#stone)"/>


    <path d="
        M240 590
        Q300 520 360 590"
        fill="none"
        stroke="#2d2923"
        stroke-width="20"/>


    <!-- stones -->
    <g stroke="#6b604d"
       stroke-width="3">

      <line x1="250" y1="600" x2="250" y2="640"/>
      <line x1="300" y1="570" x2="300" y2="640"/>
      <line x1="350" y1="600" x2="350" y2="640"/>

    </g>

  </g>


  <!-- Storyteller figure -->
  <g>

    <!-- head -->
    <circle cx="450"
            cy="560"
            r="28"
            fill="#211812"/>


    <!-- cloak -->
    <path d="
        M360 850
        Q390 590 470 600
        Q530 700 560 850Z"
        fill="#25221d"/>


    <!-- walking stick -->
    <line x1="500"
          y1="600"
          x2="560"
          y2="850"
          stroke="#5c4123"
          stroke-width="8"/>

  </g>


  <!-- Lantern -->
  <g>

    <circle cx="390"
            cy="690"
            r="100"
            fill="url(#lanternGlow)"
            filter="url(#blur)"/>


    <rect x="360"
          y="650"
          width="60"
          height="90"
          rx="10"
          fill="#8c6234"
          stroke="#e0b85d"
          stroke-width="5"/>


    <rect x="375"
          y="670"
          width="30"
          height="40"
          fill="#ffd77a"/>

  </g>


  <!-- Ancient rune stone -->
  <g>

    <path d="
        M70 760
        L160 680
        L220 760
        L180 840
        L90 830Z"
        fill="url(#stone)"/>


    <path d="
        M120 760
        L150 710
        L180 760
        L150 810Z"
        fill="none"
        stroke="#b88b45"
        stroke-width="5"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="105"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="58"
        font-weight="bold"
        fill="#ffffff">
    RIVERSTONE
  </text>


  <text x="300"
        y="175"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="72"
        font-weight="bold"
        fill="#d9c38c">
    LEGENDS
  </text>


  <!-- Genre -->
  <text x="300"
        y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="10"
        fill="#e6e0bd">
    HISTORICAL
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Beatrix O'Malley
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#e2d3a6">
    EMERALD HOUSE • 1979
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d2b77a"
        stroke-width="2"/>

</svg>