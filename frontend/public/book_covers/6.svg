<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="polarSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#061525"/>
      <stop offset="45%" stop-color="#163b52"/>
      <stop offset="100%" stop-color="#b9d8df"/>
    </linearGradient>

    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9f7ff"/>
      <stop offset="100%" stop-color="#7fa9bb"/>
    </linearGradient>

    <radialGradient id="fire">
      <stop offset="0%" stop-color="#ffd36b"/>
      <stop offset="45%" stop-color="#ff6a21"/>
      <stop offset="100%" stop-color="#c51f0c" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

  </defs>


  <!-- Polar sky -->
  <rect width="600" height="900" fill="url(#polarSky)"/>


  <!-- Aurora -->
  <path d="
      M0 230
      Q150 80 300 220
      Q450 350 600 160"
      fill="none"
      stroke="#71e1cf"
      stroke-width="45"
      opacity="0.25"
      filter="url(#glow)"/>


  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="120" r="2"/>
    <circle cx="160" cy="170" r="1.5"/>
    <circle cx="270" cy="90" r="2"/>
    <circle cx="390" cy="140" r="1.5"/>
    <circle cx="520" cy="110" r="2"/>
  </g>


  <!-- Sun/fire glow behind ice -->
  <circle cx="300" cy="430"
          r="120"
          fill="url(#fire)"
          opacity="0.8"/>


  <!-- Ice mountains -->
  <path d="
      M0 560
      L120 350
      L220 500
      L330 280
      L450 480
      L600 320
      L600 900
      L0 900Z"
      fill="url(#ice)"/>


  <!-- Mountain shadows -->
  <path d="
      M120 350
      L80 470
      L130 430
      L170 500
      L220 500
      L150 390Z"
      fill="#8bb2c2"/>

  <path d="
      M330 280
      L250 450
      L330 400
      L390 480
      L450 480
      L370 340Z"
      fill="#91bacb"/>


  <!-- Snow field -->
  <path d="
      M0 650
      Q160 590 300 680
      Q450 590 600 670
      L600 900
      L0 900Z"
      fill="#d8edf5"/>


  <!-- Explorer camp -->
  <g>

    <!-- tent -->
    <path d="
        M210 700
        L300 570
        L390 700Z"
        fill="#24333a"/>

    <path d="
        M300 570
        L300 700"
        stroke="#b8d2db"
        stroke-width="3"/>

    <!-- fire -->
    <circle cx="300" cy="735"
            r="55"
            fill="url(#fire)"/>

    <path d="
        M300 780
        Q260 730 300 690
        Q340 730 300 780Z"
        fill="#ff8b2c"/>

  </g>


  <!-- Explorer silhouette -->
  <g fill="#071019">

    <circle cx="150" cy="650" r="15"/>

    <path d="
        M120 720
        Q150 660 180 720
        L190 820
        L110 820Z"/>

    <path d="M130 810 L100 870 L130 870 L155 820Z"/>
    <path d="M165 810 L200 870 L230 870 L180 810Z"/>

  </g>


  <!-- Title -->
  <text x="300" y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="58"
        font-weight="bold"
        fill="#ffffff">
    ARCTIC
  </text>

  <text x="300" y="175"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="58"
        font-weight="bold"
        fill="#ffffff">
    FIRE
  </text>


  <!-- Genre -->
  <text x="300" y="230"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        letter-spacing="7"
        fill="#d9f0f5">
    AN ADVENTURE
  </text>


  <!-- Author -->
  <text x="300" y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="30"
        fill="#10202b">
    Elara Vance
  </text>


  <!-- Publisher -->
  <text x="300" y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#29434d">
    MAPLE LEAF PRESS • 2017
  </text>


  <!-- Border -->
  <rect x="22" y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#ffffff"
        stroke-width="2"
        opacity="0.5"/>

</svg>