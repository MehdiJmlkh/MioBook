<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="forestNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08121a"/>
      <stop offset="45%" stop-color="#18352b"/>
      <stop offset="100%" stop-color="#71835b"/>
    </linearGradient>

    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8e1d5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d8e1d5" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="tree" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111713"/>
      <stop offset="100%" stop-color="#29362a"/>
    </linearGradient>

    <radialGradient id="moonGlow">
      <stop offset="0%" stop-color="#f4efc4"/>
      <stop offset="100%" stop-color="#f4efc4" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

  </defs>


  <!-- Background -->
  <rect width="600" height="900" fill="url(#forestNight)"/>


  <!-- Moon -->
  <circle cx="430"
          cy="150"
          r="110"
          fill="url(#moonGlow)"
          filter="url(#blur)"/>

  <circle cx="430"
          cy="150"
          r="45"
          fill="#ebe6b8"/>


  <!-- Deep forest silhouettes -->
  <g fill="#07100c">

    <path d="
        M0 500
        L90 170
        L180 500Z"/>

    <path d="
        M100 520
        L220 120
        L340 520Z"/>

    <path d="
        M300 520
        L430 160
        L560 520Z"/>

    <path d="
        M450 520
        L560 210
        L650 520Z"/>

  </g>


  <!-- Pine trunks -->
  <g fill="url(#tree)">

    <rect x="85"
          y="360"
          width="28"
          height="400"/>

    <rect x="260"
          y="330"
          width="35"
          height="450"/>

    <rect x="470"
          y="370"
          width="30"
          height="400"/>

  </g>


  <!-- Pine branches -->
  <g fill="#152319">

    <path d="
        M40 420
        L100 260
        L160 420Z"/>

    <path d="
        M180 420
        L275 180
        L370 420Z"/>

    <path d="
        M390 430
        L485 230
        L580 430Z"/>

  </g>


  <!-- Mysterious fog -->
  <path d="
      M0 560
      Q150 480 300 570
      Q450 480 600 560
      L600 720
      Q450 650 300 730
      Q150 650 0 720Z"
      fill="url(#fog)"
      filter="url(#blur)"/>


  <!-- Abandoned campsite -->
  <g>

    <!-- tent -->
    <path d="
        M180 720
        L300 540
        L420 720Z"
        fill="#72583c"
        stroke="#d2b887"
        stroke-width="4"/>


    <path d="
        M300 540
        L300 720"
        stroke="#d2b887"
        stroke-width="4"/>


    <!-- campfire -->
    <ellipse cx="300"
             cy="760"
             rx="80"
             ry="30"
             fill="#e76f35"
             opacity="0.5"
             filter="url(#blur)"/>


    <path d="
        M300 800
        Q250 730 300 680
        Q350 730 300 800Z"
        fill="#ffb347"/>

  </g>


  <!-- Ghostly sound waves -->
  <g fill="none"
     stroke="#b9d8c8"
     opacity="0.8">

    <path d="
        M110 600
        Q170 540 230 600"/>

    <path d="
        M90 640
        Q170 560 250 640"/>

    <path d="
        M370 600
        Q430 540 490 600"/>

    <path d="
        M350 640
        Q430 560 510 640"/>

  </g>


  <!-- Explorer silhouette -->
  <g>

    <circle cx="300"
            cy="620"
            r="22"
            fill="#101010"/>

    <path d="
        M270 850
        Q300 650 330 850Z"
        fill="#101010"/>


    <!-- flashlight -->
    <path d="
        M330 700
        L500 620
        L510 650
        L340 730Z"
        fill="#d8e7c8"
        opacity="0.4"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="68"
        font-weight="bold"
        fill="#ffffff">
    WHISPERING
  </text>


  <text x="300"
        y="180"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="78"
        font-weight="bold"
        fill="#d9e7b0">
    PINES
  </text>


  <!-- Genre -->
  <text x="300"
        y="230"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="10"
        fill="#e7f1db">
    THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Elara Vance
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#d3e1c2">
    MAPLE LEAF PRESS • 2012
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#c5d89a"
        stroke-width="2"/>

</svg>