<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="cyberNight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050812"/>
      <stop offset="50%" stop-color="#101d35"/>
      <stop offset="100%" stop-color="#020407"/>
    </linearGradient>

    <linearGradient id="glassPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#42d9ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0c2738" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="keyMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1a6"/>
      <stop offset="40%" stop-color="#d3a63e"/>
      <stop offset="100%" stop-color="#65410d"/>
    </linearGradient>

    <radialGradient id="coreGlow">
      <stop offset="0%" stop-color="#00f6ff"/>
      <stop offset="100%" stop-color="#00f6ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

  </defs>


  <!-- Background -->
  <rect width="600" height="900" fill="url(#cyberNight)"/>


  <!-- Digital grid -->
  <g stroke="#1c7d9c"
     opacity="0.25"
     stroke-width="2">

    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
    <line x1="100" y1="250" x2="100" y2="750"/>
    <line x1="250" y1="250" x2="250" y2="750"/>
    <line x1="400" y1="250" x2="400" y2="750"/>

  </g>


  <!-- Holographic core -->
  <ellipse cx="300"
           cy="470"
           rx="170"
           ry="170"
           fill="url(#coreGlow)"
           filter="url(#glow)"/>


  <!-- Server tower -->
  <g>

    <rect x="180"
          y="300"
          width="240"
          height="380"
          rx="20"
          fill="#101820"
          stroke="#35c8e8"
          stroke-width="4"/>


    <!-- server slots -->
    <g fill="#263c4a">

      <rect x="220" y="360" width="160" height="35" rx="8"/>
      <rect x="220" y="420" width="160" height="35" rx="8"/>
      <rect x="220" y="480" width="160" height="35" rx="8"/>
      <rect x="220" y="540" width="160" height="35" rx="8"/>

    </g>


    <!-- status lights -->
    <g fill="#39e8ff">

      <circle cx="240" cy="377" r="6"/>
      <circle cx="240" cy="437" r="6"/>
      <circle cx="240" cy="497" r="6"/>
      <circle cx="240" cy="557" r="6"/>

    </g>

  </g>


  <!-- Omega symbol -->
  <g>

    <circle cx="300"
            cy="470"
            r="100"
            fill="none"
            stroke="#45eaff"
            stroke-width="6"/>


    <path d="
        M240 430
        Q300 540 360 430
        M240 430
        L240 500
        M360 430
        L360 500"
        fill="none"
        stroke="#45eaff"
        stroke-width="10"/>

  </g>


  <!-- Encryption key -->
  <g>

    <!-- key ring -->
    <circle cx="300"
            cy="710"
            r="45"
            fill="none"
            stroke="url(#keyMetal)"
            stroke-width="14"/>


    <!-- shaft -->
    <rect x="330"
          y="700"
          width="120"
          height="18"
          fill="url(#keyMetal)"/>


    <rect x="410"
          y="718"
          width="18"
          height="35"
          fill="#d3a63e"/>


    <rect x="450"
          y="718"
          width="18"
          height="25"
          fill="#d3a63e"/>

  </g>


  <!-- Cyber attack lines -->
  <g stroke="#ff4f63"
     stroke-width="4"
     opacity="0.7">

    <path d="
        M40 580
        L150 500
        L80 450"/>

    <path d="
        M560 580
        L450 500
        L520 450"/>

  </g>


  <!-- Floating data fragments -->
  <g fill="#72dff5"
     font-family="monospace"
     font-size="16">

    <text x="60" y="350">010101</text>
    <text x="430" y="390">OMEGA</text>
    <text x="80" y="700">ACCESS</text>
    <text x="440" y="650">LOCKED</text>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="62"
        font-weight="bold"
        fill="#ffffff">
    PROTOCOL
  </text>


  <text x="300"
        y="180"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="80"
        font-weight="bold"
        fill="#42dcff">
    OMEGA
  </text>


  <!-- Genre -->
  <text x="300"
        y="230"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        letter-spacing="10"
        fill="#b8eaff">
    THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Julian Thorne
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#8dd9ed">
    STERLING PRESS • 2003
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#35c8e8"
        stroke-width="2"
        opacity="0.8"/>

</svg>