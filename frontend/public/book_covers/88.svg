<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="romanNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120d12"/>
      <stop offset="45%" stop-color="#3b2525"/>
      <stop offset="100%" stop-color="#b47a45"/>
    </linearGradient>

    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2d7bf"/>
      <stop offset="100%" stop-color="#71665a"/>
    </linearGradient>

    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d5ad55"/>
      <stop offset="50%" stop-color="#8a6428"/>
      <stop offset="100%" stop-color="#302113"/>
    </linearGradient>

    <filter id="torchGlow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

  </defs>


  <!-- Ancient Rome atmosphere -->
  <rect width="600" height="900" fill="url(#romanNight)"/>


  <!-- Torch light -->
  <circle cx="300"
          cy="330"
          r="100"
          fill="#e9a84e"
          opacity="0.2"
          filter="url(#torchGlow)"/>


  <!-- Roman columns background -->
  <g fill="url(#marble)"
     opacity="0.75">

    <rect x="80"
          y="300"
          width="55"
          height="330"/>

    <rect x="465"
          y="300"
          width="55"
          height="330"/>


    <rect x="65"
          y="280"
          width="85"
          height="25"/>

    <rect x="450"
          y="280"
          width="85"
          height="25"/>

  </g>


  <!-- Temple roof -->
  <path d="
      M40 280
      L300 140
      L560 280Z"
      fill="#29201b"/>


  <path d="
      M80 270
      L300 170
      L520 270"
      fill="none"
      stroke="#c79d52"
      stroke-width="5"/>


  <!-- Marble floor -->
  <path d="
      M0 620
      L600 620
      L600 900
      L0 900Z"
      fill="#332c28"/>


  <!-- Praetorian guard -->
  <g>

    <!-- helmet -->
    <path d="
        M220 430
        Q300 350 380 430
        L365 500
        L235 500Z"
        fill="url(#armor)"
        stroke="#22170c"
        stroke-width="6"/>


    <!-- crest -->
    <path d="
        M300 350
        L300 260
        Q350 300 300 390"
        fill="#9b332b"/>


    <!-- face shadow -->
    <path d="
        M255 450
        Q300 420 345 450
        L330 520
        L270 520Z"
        fill="#25201d"/>


    <!-- armor body -->
    <path d="
        M170 900
        Q210 520 300 520
        Q390 520 430 900Z"
        fill="#191919"/>


    <!-- golden chest plates -->
    <path d="
        M220 560
        L300 530
        L380 560
        L360 720
        L240 720Z"
        fill="url(#armor)"
        stroke="#382510"
        stroke-width="5"/>


    <line x1="250"
          y1="600"
          x2="350"
          y2="600"
          stroke="#e1bd68"
          stroke-width="4"/>


    <line x1="245"
          y1="650"
          x2="355"
          y2="650"
          stroke="#e1bd68"
          stroke-width="4"/>


    <!-- spear -->
    <line x1="430"
          y1="360"
          x2="470"
          y2="860"
          stroke="#68421d"
          stroke-width="10"/>


    <polygon points="
        430,360
        470,360
        450,290"
        fill="#d8b45e"/>


    <!-- shield -->
    <path d="
        M100 540
        Q170 500 190 600
        Q170 720 100 680Z"
        fill="#8b3028"
        stroke="#d6aa4f"
        stroke-width="6"/>


    <circle cx="145"
            cy="610"
            r="25"
            fill="#d6aa4f"/>

  </g>


  <!-- Eagle emblem -->
  <g>

    <circle cx="300"
            cy="760"
            r="55"
            fill="#201912"
            stroke="#d8b05b"
            stroke-width="5"/>


    <path d="
        M300 710
        L330 760
        L300 815
        L270 760Z"
        fill="#d8b05b"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="95"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="72"
        font-weight="bold"
        fill="#ffffff">
    PRAETORIAN
  </text>


  <text x="300"
        y="175"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="86"
        font-weight="bold"
        fill="#d9b15d">
    VOW
  </text>


  <!-- Genre -->
  <text x="300"
        y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="10"
        fill="#e8d5aa">
    HISTORICAL
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Marcus Valerius
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#d9b15d">
    ROMA BOOKS • 2010
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#c99a4c"
        stroke-width="2"/>

</svg>