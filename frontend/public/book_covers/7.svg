<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080d18"/>
      <stop offset="55%" stop-color="#3b1718"/>
      <stop offset="100%" stop-color="#120807"/>
    </linearGradient>

    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e3438"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>

    <radialGradient id="moon">
      <stop offset="0%" stop-color="#fff3d0"/>
      <stop offset="100%" stop-color="#d4b17a"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="15"/>
    </filter>

  </defs>


  <!-- Background -->
  <rect width="600" height="900" fill="url(#night)"/>


  <!-- Moon -->
  <circle cx="430" cy="220" r="100"
          fill="#e7b46d"
          opacity="0.15"
          filter="url(#glow)"/>

  <circle cx="430" cy="220" r="65"
          fill="url(#moon)"/>


  <!-- Japanese temple silhouette -->
  <g fill="#090d12">

    <rect x="80" y="430" width="440" height="160"/>

    <polygon points="60,430 300,300 540,430"/>

    <polygon points="100,380 300,260 500,380"/>

    <rect x="250" y="470" width="100" height="120"/>

  </g>


  <!-- Mountain -->
  <path d="
      M0 560
      L150 370
      L260 520
      L390 330
      L600 560
      L600 900
      L0 900Z"
      fill="url(#mountain)"/>


  <!-- Cherry blossom tree -->
  <g>

    <path d="
        M120 620
        Q160 430 220 350"
        fill="none"
        stroke="#1b120d"
        stroke-width="25"/>

    <g fill="#d989a1">
      <circle cx="150" cy="420" r="14"/>
      <circle cx="190" cy="390" r="12"/>
      <circle cx="220" cy="340" r="15"/>
      <circle cx="120" cy="470" r="11"/>
      <circle cx="175" cy="500" r="13"/>
    </g>

  </g>


  <!-- Ground -->
  <path d="
      M0 650
      Q200 600 350 680
      Q480 730 600 640
      L600 900
      L0 900Z"
      fill="#07090d"/>


  <!-- Samurai silhouette -->
  <g fill="#050608">

    <!-- head -->
    <circle cx="320" cy="500" r="20"/>

    <!-- helmet -->
    <path d="
        M290 490
        Q320 450 350 490
        L350 510
        L290 510Z"/>

    <!-- body armor -->
    <path d="
        M260 540
        Q320 500 380 540
        L400 700
        L240 700Z"/>

    <!-- legs -->
    <path d="M270 680 L220 830 L270 830 L320 700Z"/>
    <path d="M350 680 L400 830 L450 830 L370 680Z"/>

    <!-- sword -->
    <rect x="420" y="520"
          width="10"
          height="260"
          transform="rotate(15 420 520)"/>

    <!-- sword handle -->
    <rect x="395" y="540"
          width="60"
          height="12"
          transform="rotate(15 395 540)"/>

  </g>


  <!-- Falling leaves -->
  <g fill="#c67c55">
    <path d="M90 260 Q110 240 130 260 Q110 290 90 260Z"/>
    <path d="M520 360 Q540 340 560 360 Q540 390 520 360Z"/>
    <path d="M250 300 Q270 280 290 300 Q270 330 250 300Z"/>
  </g>


  <!-- Title -->
  <text x="300" y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="58"
        font-weight="bold"
        fill="#f3dfb2">
    SAMURAI
  </text>

  <text x="300" y="175"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="58"
        font-weight="bold"
        fill="#f3dfb2">
    CODE
  </text>


  <!-- Genre -->
  <text x="300" y="230"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="5"
        fill="#e6c9a0">
    HISTORICAL • THRILLER
  </text>


  <!-- Author -->
  <text x="300" y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="30"
        fill="#ffffff">
    Hiroshi Tanaka
  </text>


  <!-- Publisher -->
  <text x="300" y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#d9c7a5">
    SORA PUBLISHING • 2019
  </text>


  <!-- Border -->
  <rect x="22" y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#e3c48b"
        stroke-width="2"
        opacity="0.45"/>

</svg>