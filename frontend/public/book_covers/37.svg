<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="romanFrontierSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#160d12"/>
      <stop offset="45%" stop-color="#8b3f2b"/>
      <stop offset="100%" stop-color="#d49a55"/>
    </linearGradient>

    <linearGradient id="burningMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd36b"/>
      <stop offset="50%" stop-color="#d45b2b"/>
      <stop offset="100%" stop-color="#5d1d18"/>
    </linearGradient>

    <radialGradient id="fireGlow">
      <stop offset="0%" stop-color="#ffdb72"/>
      <stop offset="100%" stop-color="#ff6b32" stop-opacity="0"/>
    </radialGradient>

    <filter id="fireBlur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

  </defs>


  <!-- Burning frontier sky -->
  <rect width="600" height="900" fill="url(#romanFrontierSky)"/>


  <!-- Fire horizon glow -->
  <ellipse cx="300"
           cy="480"
           rx="250"
           ry="150"
           fill="url(#fireGlow)"
           filter="url(#fireBlur)"/>


  <!-- Distant mountains -->
  <path d="
      M0 430
      L130 270
      L250 420
      L390 250
      L600 440
      L600 600
      L0 600Z"
      fill="#261b18"/>


  <!-- Roman frontier fort -->
  <g fill="#29231f">

    <rect x="60"
          y="380"
          width="200"
          height="220"/>

    <rect x="350"
          y="350"
          width="190"
          height="250"/>


    <!-- watch towers -->
    <rect x="90"
          y="280"
          width="45"
          height="320"/>

    <rect x="455"
          y="240"
          width="45"
          height="360"/>

  </g>


  <!-- burning windows -->
  <g fill="#ffb34c">

    <rect x="105" y="370" width="18" height="35"/>
    <rect x="470" y="330" width="18" height="35"/>
    <rect x="390" y="420" width="18" height="35"/>

  </g>


  <!-- Roman eagle banner -->
  <g>

    <line x1="300"
          y1="250"
          x2="300"
          y2="650"
          stroke="#1c120c"
          stroke-width="12"/>


    <path d="
        M300 270
        Q390 330 300 390
        Q210 330 300 270Z"
        fill="#8c1f23"/>


    <!-- eagle -->
    <path d="
        M270 320
        L300 290
        L330 320
        L300 350Z"
        fill="#d8b15c"/>

  </g>


  <!-- Battlefield ground -->
  <path d="
      M0 600
      Q300 540 600 600
      L600 900
      L0 900Z"
      fill="#211611"/>


  <!-- Flames -->
  <g fill="#e45124">

    <path d="
        M80 720
        Q110 650 140 720
        Q120 680 170 630
        Q160 750 80 780Z"/>


    <path d="
        M500 760
        Q530 680 560 750
        Q530 700 580 660
        Q570 790 500 820Z"/>

  </g>


  <!-- Roman soldier -->
  <g fill="#080b0e">

    <!-- helmet -->
    <path d="
        M260 450
        Q330 390 400 450
        L390 500
        L270 500Z"/>


    <!-- plume -->
    <path d="
        M320 420
        Q340 330 360 420"
        fill="#b53b2e"/>


    <!-- body armor -->
    <path d="
        M240 600
        Q330 500 420 600
        L500 850
        L160 850Z"/>


    <!-- spear -->
    <line x1="450"
          y1="480"
          x2="520"
          y2="840"
          stroke="#3b2412"
          stroke-width="10"/>

    <polygon points="
        450,430
        430,500
        470,500"
        fill="#c6c2a7"/>

  </g>


  <!-- Broken shield -->
  <g>

    <path d="
        M120 650
        Q170 600 220 650
        L200 780
        Q160 820 120 780Z"
        fill="url(#burningMetal)"/>


    <line x1="160"
          y1="650"
          x2="170"
          y2="780"
          stroke="#4a2419"
          stroke-width="8"/>

  </g>


  <!-- Ash particles -->
  <g fill="#e8cfa1">

    <circle cx="120" cy="300" r="4"/>
    <circle cx="180" cy="250" r="5"/>
    <circle cx="500" cy="280" r="4"/>
    <circle cx="430" cy="220" r="3"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="55"
        font-weight="bold"
        fill="#ffd98a">
    FRONTIER
  </text>

  <text x="300"
        y="175"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="68"
        font-weight="bold"
        fill="#ffffff">
    FLAMES
  </text>


  <!-- Genre -->
  <text x="300"
        y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="6"
        fill="#eac58b">
    HISTORICAL • ADVENTURE
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="30"
        fill="#ffffff">
    Marcus Valerius
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#e7c98d">
    ROMA BOOKS • 2014
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d6b064"
        stroke-width="2"
        opacity="0.6"/>

</svg>