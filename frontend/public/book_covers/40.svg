<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="darkCity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090b14"/>
      <stop offset="45%" stop-color="#30333d"/>
      <stop offset="100%" stop-color="#6b5548"/>
    </linearGradient>

    <linearGradient id="paperLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1c7"/>
      <stop offset="100%" stop-color="#8f7552"/>
    </linearGradient>

    <radialGradient id="lampGlow">
      <stop offset="0%" stop-color="#ffd77a"/>
      <stop offset="100%" stop-color="#ffd77a" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurLight">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

  </defs>


  <!-- Dark thriller background -->
  <rect width="600" height="900" fill="url(#darkCity)"/>


  <!-- Street lamp atmosphere -->
  <circle cx="460"
          cy="330"
          r="160"
          fill="url(#lampGlow)"
          filter="url(#blurLight)"/>


  <!-- Rainy city buildings -->
  <g fill="#11151d">

    <rect x="40"
          y="300"
          width="130"
          height="330"/>

    <rect x="210"
          y="240"
          width="150"
          height="390"/>

    <rect x="420"
          y="280"
          width="130"
          height="350"/>

  </g>


  <!-- Office windows -->
  <g fill="#c7a95a">

    <rect x="80" y="360" width="15" height="25"/>
    <rect x="120" y="430" width="15" height="25"/>
    <rect x="250" y="320" width="18" height="30"/>
    <rect x="300" y="390" width="18" height="30"/>
    <rect x="460" y="360" width="15" height="25"/>
    <rect x="500" y="450" width="15" height="25"/>

  </g>


  <!-- Hidden alley -->
  <path d="
      M0 620
      L600 620
      L600 900
      L0 900Z"
      fill="#0b0e13"/>


  <!-- Newspaper wall -->
  <g>

    <rect x="100"
          y="420"
          width="160"
          height="220"
          fill="url(#paperLight)"
          transform="rotate(-8 100 420)"/>


    <g stroke="#766044"
       stroke-width="3">

      <line x1="130" y1="480" x2="230" y2="480"/>
      <line x1="125" y1="510" x2="240" y2="510"/>
      <line x1="120" y1="540" x2="220" y2="540"/>

    </g>


    <!-- censored truth lines -->
    <g fill="#1a1c22">

      <rect x="140"
            y="565"
            width="90"
            height="10"/>

      <rect x="150"
            y="590"
            width="70"
            height="10"/>

    </g>

  </g>


  <!-- Journalist silhouette -->
  <g fill="#070a0e">

    <!-- hat -->
    <ellipse cx="350"
             cy="420"
             rx="50"
             ry="15"/>


    <!-- head -->
    <circle cx="350"
            cy="460"
            r="28"/>


    <!-- coat -->
    <path d="
        M280 580
        Q350 500 430 580
        L500 850
        L200 850Z"/>


    <!-- camera -->
    <rect x="250"
          y="570"
          width="90"
          height="60"
          rx="8"
          fill="#252b31"/>


    <circle cx="295"
            cy="600"
            r="18"
            fill="#768895"/>

  </g>


  <!-- Broken scales of truth -->
  <g>

    <line x1="470"
          y1="600"
          x2="470"
          y2="760"
          stroke="#c9a35d"
          stroke-width="8"/>


    <line x1="400"
          y1="650"
          x2="540"
          y2="650"
          stroke="#c9a35d"
          stroke-width="6"/>


    <path d="
        M410 660
        Q450 720 490 660"
        fill="none"
        stroke="#c9a35d"
        stroke-width="5"/>


    <path d="
        M450 660
        Q490 720 530 660"
        fill="none"
        stroke="#c9a35d"
        stroke-width="5"/>

  </g>


  <!-- Torn document -->
  <path d="
      M80 760
      L180 700
      L230 820
      L120 850Z"
      fill="#d7c49a"/>


  <path d="
      M110 770
      L180 735"
      stroke="#55412a"
      stroke-width="4"/>


  <!-- Rain -->
  <g stroke="#9fb0b8"
     opacity="0.5"
     stroke-width="3">

    <line x1="70" y1="150" x2="40" y2="260"/>
    <line x1="180" y1="100" x2="150" y2="230"/>
    <line x1="430" y1="120" x2="400" y2="250"/>
    <line x1="520" y1="150" x2="490" y2="270"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="58"
        font-weight="bold"
        fill="#ffffff">
    SIEGE OF
  </text>

  <text x="300"
        y="175"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="72"
        font-weight="bold"
        fill="#e6bd69">
    TRUTH
  </text>


  <!-- Genre -->
  <text x="300"
        y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        letter-spacing="9"
        fill="#d8c79b">
    THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="30"
        fill="#ffffff">
    Julian Thorne
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#e1c78d">
    STERLING PRESS • 2000
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d5b46c"
        stroke-width="2"
        opacity="0.6"/>

</svg>