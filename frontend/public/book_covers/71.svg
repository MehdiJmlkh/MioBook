<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="noirCity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="45%" stop-color="#1b2028"/>
      <stop offset="100%" stop-color="#3d2520"/>
    </linearGradient>

    <linearGradient id="paperLedger" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0dfb5"/>
      <stop offset="100%" stop-color="#8f6d42"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4e5e0"/>
      <stop offset="100%" stop-color="#4b5054"/>
    </linearGradient>

    <radialGradient id="redGlow">
      <stop offset="0%" stop-color="#ff4b3e"/>
      <stop offset="100%" stop-color="#ff4b3e" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

  </defs>


  <!-- Background -->
  <rect width="600" height="900" fill="url(#noirCity)"/>


  <!-- Red investigation glow -->
  <circle cx="420"
          cy="250"
          r="170"
          fill="url(#redGlow)"
          filter="url(#blur)"/>


  <!-- City skyline -->
  <g fill="#080b10">

    <rect x="40"
          y="390"
          width="90"
          height="260"/>

    <rect x="170"
          y="310"
          width="100"
          height="340"/>

    <rect x="320"
          y="350"
          width="120"
          height="300"/>

    <rect x="490"
          y="280"
          width="70"
          height="370"/>

  </g>


  <!-- Office windows -->
  <g fill="#d39b4a">

    <rect x="70" y="430" width="15" height="10"/>
    <rect x="70" y="480" width="15" height="10"/>

    <rect x="200" y="370" width="18" height="10"/>
    <rect x="200" y="420" width="18" height="10"/>

    <rect x="360" y="410" width="18" height="10"/>
    <rect x="360" y="470" width="18" height="10"/>

  </g>


  <!-- Giant accounting ledger -->
  <g>

    <!-- shadow -->
    <rect x="130"
          y="470"
          width="340"
          height="230"
          rx="10"
          fill="#050505"
          opacity="0.7"/>


    <!-- book -->
    <rect x="120"
          y="440"
          width="340"
          height="230"
          rx="10"
          fill="url(#paperLedger)"
          stroke="#342617"
          stroke-width="8"/>


    <!-- spine -->
    <rect x="145"
          y="440"
          width="25"
          height="230"
          fill="#6c4427"/>


    <!-- ledger lines -->
    <g stroke="#76552f"
       stroke-width="3">

      <line x1="200" y1="500" x2="420" y2="500"/>
      <line x1="200" y1="550" x2="420" y2="550"/>
      <line x1="200" y1="600" x2="420" y2="600"/>

    </g>


    <!-- numbers -->
    <g font-family="monospace"
       font-size="22"
       fill="#392719">

      <text x="220" y="485">$ 7,942,110</text>
      <text x="220" y="535">X-09382</text>
      <text x="220" y="585">BLACK FUND</text>

    </g>


    <!-- red stamp -->
    <circle cx="365"
            cy="610"
            r="45"
            fill="none"
            stroke="#b21e25"
            stroke-width="8"/>

    <text x="365"
          y="618"
          text-anchor="middle"
          font-size="15"
          font-family="Arial"
          fill="#b21e25">
      SECRET
    </text>

  </g>


  <!-- Magnifying glass -->
  <g>

    <circle cx="180"
            cy="760"
            r="70"
            fill="none"
            stroke="url(#metal)"
            stroke-width="12"/>


    <line x1="230"
          y1="810"
          x2="330"
          y2="870"
          stroke="#9ca3a8"
          stroke-width="18"/>


    <circle cx="180"
            cy="760"
            r="55"
            fill="#111b24"
            opacity="0.5"/>

  </g>


  <!-- Detective silhouette -->
  <g>

    <circle cx="430"
            cy="700"
            r="35"
            fill="#050505"/>


    <path d="
        M370 900
        Q400 720 460 720
        Q520 720 550 900Z"
        fill="#050505"/>


    <!-- tie -->
    <path d="
        M425 760
        L450 760
        L438 850Z"
        fill="#9d1d24"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="78"
        font-weight="bold"
        fill="#ffffff">
    DARK
  </text>


  <text x="300"
        y="185"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="82"
        font-weight="bold"
        fill="#d9a85c">
    LEDGER
  </text>


  <!-- Genre -->
  <text x="300"
        y="235"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="12"
        fill="#f1d5a2">
    THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Julian Thorne
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#e6c98e">
    STERLING PRESS • 2008
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#c48c4a"
        stroke-width="2"/>

</svg>