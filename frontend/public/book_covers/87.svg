<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="polarSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06121d"/>
      <stop offset="45%" stop-color="#274b61"/>
      <stop offset="100%" stop-color="#d7c9a2"/>
    </linearGradient>

    <linearGradient id="snowMountain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f6f1"/>
      <stop offset="100%" stop-color="#7f9aaa"/>
    </linearGradient>

    <linearGradient id="iceCliff" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#243845"/>
      <stop offset="100%" stop-color="#0b1822"/>
    </linearGradient>

    <filter id="auroraGlow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

  </defs>


  <!-- Frozen night sky -->
  <rect width="600" height="900" fill="url(#polarSky)"/>


  <!-- Aurora -->
  <g opacity="0.45" filter="url(#auroraGlow)">
    <path d="
      M40 180
      Q170 60 300 180
      Q430 300 570 140"
      fill="none"
      stroke="#65e0c7"
      stroke-width="45"/>

    <path d="
      M80 250
      Q220 120 400 260"
      fill="none"
      stroke="#6ea7ff"
      stroke-width="30"/>
  </g>


  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="130" r="3"/>
    <circle cx="180" cy="90" r="2"/>
    <circle cx="420" cy="120" r="3"/>
    <circle cx="520" cy="180" r="2"/>
  </g>


  <!-- Mountain range -->
  <path d="
      M0 470
      L150 250
      L260 420
      L390 180
      L600 480
      L600 600
      L0 600Z"
      fill="url(#snowMountain)"/>


  <!-- Dark mountain cuts -->
  <path d="
      M150 250
      L260 420
      L330 320
      L390 180
      L320 480
      L0 600
      L0 470Z"
      fill="#344b58"/>


  <!-- Ice cliffs -->
  <path d="
      M0 520
      L180 450
      L260 540
      L390 420
      L600 560
      L600 900
      L0 900Z"
      fill="url(#iceCliff)"/>


  <!-- Lost expedition camp -->
  <g>

    <!-- tent -->
    <path d="
        M120 650
        L210 520
        L300 650Z"
        fill="#d95b45"
        stroke="#281b17"
        stroke-width="5"/>

    <line x1="210"
          y1="520"
          x2="210"
          y2="650"
          stroke="#f0c6a2"
          stroke-width="3"/>


    <!-- abandoned radio -->
    <rect x="330"
          y="610"
          width="90"
          height="70"
          rx="8"
          fill="#242b31"
          stroke="#9ab4bf"
          stroke-width="4"/>

    <line x1="375"
          y1="610"
          x2="375"
          y2="540"
          stroke="#d5e9ef"
          stroke-width="4"/>

    <circle cx="375"
            cy="535"
            r="7"
            fill="#65e0c7"/>

  </g>


  <!-- Climber -->
  <g>

    <!-- head -->
    <circle cx="430"
            cy="700"
            r="24"
            fill="#15191e"/>


    <!-- body -->
    <path d="
        M390 900
        Q430 730 470 900Z"
        fill="#10151b"/>


    <!-- climbing rope -->
    <path d="
        M430 730
        Q360 680 300 570"
        fill="none"
        stroke="#d7b36a"
        stroke-width="5"/>


    <!-- ice axe -->
    <line x1="480"
          y1="760"
          x2="540"
          y2="640"
          stroke="#bfcbd1"
          stroke-width="8"/>


    <line x1="530"
          y1="650"
          x2="555"
          y2="650"
          stroke="#bfcbd1"
          stroke-width="8"/>

  </g>


  <!-- Signal waves -->
  <g fill="none"
     stroke="#65e0c7"
     stroke-width="3"
     opacity="0.8">

    <path d="M350 420 Q430 360 510 420"/>
    <path d="M370 450 Q430 410 490 450"/>
    <path d="M390 480 Q430 450 470 480"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="105"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="75"
        font-weight="bold"
        fill="#ffffff">
    SNOWLINE
  </text>


  <text x="300"
        y="185"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="82"
        font-weight="bold"
        fill="#8fe3e5">
    ECHO
  </text>


  <!-- Genre -->
  <text x="300"
        y="235"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="9"
        fill="#e6e9e4">
    ADVENTURE • THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Elara Vance
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#bfe3e6">
    MAPLE LEAF PRESS • 2015
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#9ed4d8"
        stroke-width="2"/>

</svg>