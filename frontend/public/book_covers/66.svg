<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="cyberNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050713"/>
      <stop offset="50%" stop-color="#101d38"/>
      <stop offset="100%" stop-color="#182f42"/>
    </linearGradient>

    <linearGradient id="cityGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1ef2ff"/>
      <stop offset="100%" stop-color="#086080"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8faff"/>
      <stop offset="50%" stop-color="#3cc5d9"/>
      <stop offset="100%" stop-color="#062c42"/>
    </linearGradient>

    <radialGradient id="screenGlow">
      <stop offset="0%" stop-color="#5fffff"/>
      <stop offset="100%" stop-color="#5fffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

  </defs>


  <!-- Background -->
  <rect width="600" height="900" fill="url(#cyberNight)"/>


  <!-- Digital glow -->
  <circle cx="300"
          cy="330"
          r="220"
          fill="url(#screenGlow)"
          filter="url(#blur)"
          opacity="0.5"/>


  <!-- Futuristic skyline -->
  <g fill="#07121f">

    <rect x="40"
          y="390"
          width="70"
          height="260"/>

    <rect x="130"
          y="320"
          width="90"
          height="330"/>

    <rect x="250"
          y="270"
          width="110"
          height="380"/>

    <rect x="390"
          y="350"
          width="100"
          height="300"/>

    <rect x="520"
          y="410"
          width="50"
          height="240"/>

  </g>


  <!-- Building lights -->
  <g fill="#1ce7ff">

    <rect x="60" y="430" width="12" height="8"/>
    <rect x="60" y="480" width="12" height="8"/>
    <rect x="160" y="380" width="15" height="8"/>
    <rect x="280" y="340" width="15" height="8"/>
    <rect x="420" y="420" width="15" height="8"/>
    <rect x="420" y="470" width="15" height="8"/>

  </g>


  <!-- Digital circuit lines -->
  <g stroke="#25d9f0"
     stroke-width="3"
     opacity="0.8">

    <path d="M40 220 L180 220 L220 180"/>
    <path d="M560 260 L430 260 L390 300"/>
    <path d="M70 700 L170 620 L250 620"/>
    <path d="M530 720 L420 620 L350 620"/>

  </g>


  <!-- Floating code -->
  <g font-family="monospace"
     font-size="18"
     fill="#38eaff"
     opacity="0.8">

    <text x="80" y="300">010101</text>
    <text x="420" y="340">110010</text>
    <text x="90" y="760">ACCESS</text>
    <text x="420" y="780">ROOT//</text>

  </g>


  <!-- Cipher device -->
  <g>

    <!-- holographic terminal -->
    <rect x="160"
          y="420"
          width="280"
          height="190"
          rx="20"
          fill="url(#glass)"
          opacity="0.9"
          stroke="#6cf5ff"
          stroke-width="5"/>


    <!-- screen -->
    <rect x="190"
          y="450"
          width="220"
          height="100"
          fill="#03121d"
          stroke="#3beaff"
          stroke-width="3"/>


    <!-- encrypted text -->
    <g font-family="monospace"
       font-size="18"
       fill="#45f3ff">

      <text x="210" y="485">CIPHER_07</text>
      <text x="210" y="515">F4A9-X92</text>
      <text x="210" y="545">BREACH?</text>

    </g>


    <!-- keyboard -->
    <g fill="#0a2634">

      <rect x="210"
            y="570"
            width="180"
            height="20"/>

      <circle cx="240" cy="580" r="4" fill="#38eaff"/>
      <circle cx="270" cy="580" r="4" fill="#38eaff"/>
      <circle cx="300" cy="580" r="4" fill="#38eaff"/>
      <circle cx="330" cy="580" r="4" fill="#38eaff"/>

    </g>

  </g>


  <!-- Hacker silhouette -->
  <g>

    <circle cx="300"
            cy="690"
            r="45"
            fill="#05080d"/>


    <path d="
        M210 900
        Q230 720 300 720
        Q370 720 390 900Z"
        fill="#05080d"/>


    <!-- hood -->
    <path d="
        M230 690
        Q300 590 370 690"
        fill="none"
        stroke="#111827"
        stroke-width="25"/>

  </g>


  <!-- Data globe -->
  <g>

    <circle cx="470"
            cy="650"
            r="60"
            fill="none"
            stroke="#39eaff"
            stroke-width="4"/>


    <ellipse cx="470"
             cy="650"
             rx="60"
             ry="25"
             fill="none"
             stroke="#39eaff"
             stroke-width="3"/>


    <line x1="410"
          y1="650"
          x2="530"
          y2="650"
          stroke="#39eaff"
          stroke-width="3"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="70"
        font-weight="bold"
        fill="#ffffff">
    TERMINAL
  </text>


  <text x="300"
        y="180"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="78"
        font-weight="bold"
        fill="#42e8ff">
    CIPHER
  </text>


  <!-- Genre -->
  <text x="300"
        y="230"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="10"
        fill="#d8faff">
    THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Julian Thorne
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#b8eaf2">
    STERLING PRESS • 2014
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#35dff5"
        stroke-width="2"/>

</svg>