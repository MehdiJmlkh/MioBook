<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="polarMist" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1822"/>
      <stop offset="45%" stop-color="#334b5a"/>
      <stop offset="100%" stop-color="#a9c1c9"/>
    </linearGradient>

    <linearGradient id="iceWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8edf3"/>
      <stop offset="100%" stop-color="#607d89"/>
    </linearGradient>

    <radialGradient id="echoLight">
      <stop offset="0%" stop-color="#dffaff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8bc7d8" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

  </defs>


  <!-- Frozen atmosphere -->
  <rect width="600" height="900" fill="url(#polarMist)"/>


  <!-- Strange blue light in the sky -->
  <ellipse cx="300" cy="330"
           rx="230"
           ry="160"
           fill="url(#echoLight)"
           filter="url(#blur)"/>


  <!-- Northern lights -->
  <path d="
      M0 220
      Q130 100 260 210
      Q400 340 600 160"
      fill="none"
      stroke="#8be3dc"
      stroke-width="35"
      opacity="0.18"/>

  <path d="
      M40 260
      Q180 160 350 250
      Q470 320 580 240"
      fill="none"
      stroke="#c4f4e9"
      stroke-width="12"
      opacity="0.2"/>


  <!-- Abandoned radio tower -->
  <g fill="#101820">

    <rect x="300" y="270" width="10" height="300"/>

    <path d="
      M305 280
      L220 570
      L390 570Z"
      fill="none"
      stroke="#101820"
      stroke-width="8"/>

    <path d="
      M230 370
      L380 370"
      stroke="#101820"
      stroke-width="8"/>

    <path d="
      M250 450
      L360 450"
      stroke="#101820"
      stroke-width="8"/>

  </g>


  <!-- Frozen abandoned buildings -->
  <g fill="#25343d">

    <path d="
      M40 620
      L40 430
      L140 360
      L220 430
      L220 620Z"/>

    <path d="
      M390 620
      L390 410
      L480 350
      L560 430
      L560 620Z"/>

  </g>


  <!-- Broken windows -->
  <g fill="#91c8d6">

    <rect x="80" y="470" width="28" height="45"/>
    <rect x="150" y="480" width="28" height="45"/>

    <rect x="430" y="450" width="30" height="50"/>
    <rect x="500" y="470" width="30" height="50"/>

  </g>


  <!-- Frozen lake -->
  <path d="
      M0 650
      Q150 580 300 670
      Q450 590 600 650
      L600 900
      L0 900Z"
      fill="url(#iceWall)"/>


  <!-- Cracked ice -->
  <g stroke="#8ab3c1"
     stroke-width="3"
     opacity="0.8">

    <path d="M100 700 L180 760 L140 850"/>
    <path d="M400 680 L340 750 L420 840"/>
    <path d="M250 720 L300 780 L260 860"/>

  </g>


  <!-- Mysterious figure made from frost -->
  <g opacity="0.75">

    <circle cx="300" cy="570"
            r="25"
            fill="#e6fbff"/>

    <path d="
        M245 780
        Q300 600 355 780
        L390 850
        L210 850Z"
        fill="#d8f5fa"/>

  </g>


  <!-- Detective with old recorder -->
  <g fill="#080d12">

    <circle cx="170" cy="610" r="17"/>

    <path d="
        M130 720
        Q170 650 210 720
        L225 830
        L115 830Z"/>

    <!-- recorder -->
    <rect x="210" y="690"
          width="55"
          height="35"
          rx="5"/>

    <circle cx="225" cy="707" r="5"
            fill="#6dd5e8"/>

  </g>


  <!-- Sound waves from recorder -->
  <g fill="none"
     stroke="#b9f0ff"
     stroke-width="4"
     opacity="0.7">

    <path d="M280 680 Q330 640 380 680"/>
    <path d="M280 640 Q350 570 420 640"/>
    <path d="M280 590 Q380 480 480 590"/>

  </g>


  <!-- Snow particles -->
  <g fill="#ffffff">

    <circle cx="100" cy="260" r="3"/>
    <circle cx="190" cy="330" r="2"/>
    <circle cx="470" cy="250" r="3"/>
    <circle cx="530" cy="340" r="2"/>
    <circle cx="390" cy="180" r="2"/>

  </g>


  <!-- Title -->
  <text x="300" y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="54"
        font-weight="bold"
        fill="#f5fbff">
    FROZEN
  </text>

  <text x="300" y="170"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="54"
        font-weight="bold"
        fill="#f5fbff">
    ECHOES
  </text>


  <!-- Subtitle -->
  <text x="300" y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="6"
        fill="#d4edf3">
    A THRILLER
  </text>


  <!-- Author -->
  <text x="300" y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="30"
        fill="#10202a">
    Elara Vance
  </text>


  <!-- Publisher -->
  <text x="300" y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#263d47">
    MAPLE LEAF PRESS • 2014
  </text>


  <!-- Frame -->
  <rect x="22" y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d9f5ff"
        stroke-width="2"
        opacity="0.55"/>

</svg>