<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="romeNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090909"/>
      <stop offset="45%" stop-color="#3b2020"/>
      <stop offset="100%" stop-color="#c38a4b"/>
    </linearGradient>

    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfce"/>
      <stop offset="100%" stop-color="#8c8170"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4d77c"/>
      <stop offset="50%" stop-color="#b27b22"/>
      <stop offset="100%" stop-color="#5a3812"/>
    </linearGradient>

    <radialGradient id="torch">
      <stop offset="0%" stop-color="#ffd77a"/>
      <stop offset="100%" stop-color="#ff8c32" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

  </defs>


  <!-- Background -->
  <rect width="600" height="900" fill="url(#romeNight)"/>


  <!-- Torch light -->
  <circle cx="500"
          cy="330"
          r="130"
          fill="url(#torch)"
          filter="url(#blur)"/>


  <!-- Roman senate columns -->
  <g fill="url(#marble)"
     opacity="0.7">

    <rect x="70"
          y="360"
          width="55"
          height="370"/>

    <rect x="475"
          y="360"
          width="55"
          height="370"/>


    <path d="
        M40 360
        L560 360
        L520 320
        L80 320Z"/>


    <path d="
        M40 730
        L560 730
        L520 770
        L80 770Z"/>


  </g>


  <!-- Senate floor -->
  <ellipse cx="300"
           cy="760"
           rx="260"
           ry="80"
           fill="#4b3022"/>


  <!-- Political chess board -->
  <g>

    <rect x="170"
          y="600"
          width="260"
          height="120"
          fill="#241a14"
          stroke="#c79b45"
          stroke-width="5"/>


    <!-- chess pattern -->
    <g fill="#d0b27a">

      <rect x="170" y="600" width="40" height="30"/>
      <rect x="250" y="600" width="40" height="30"/>
      <rect x="330" y="600" width="40" height="30"/>

      <rect x="210" y="630" width="40" height="30"/>
      <rect x="290" y="630" width="40" height="30"/>
      <rect x="370" y="630" width="40" height="30"/>

      <rect x="170" y="660" width="40" height="30"/>
      <rect x="250" y="660" width="40" height="30"/>
      <rect x="330" y="660" width="40" height="30"/>

    </g>


    <!-- chess pieces -->
    <g fill="url(#gold)">

      <path d="
          M230 620
          L245 580
          L260 620Z"/>

      <circle cx="245"
              cy="570"
              r="12"/>


      <path d="
          M350 680
          L365 620
          L380 680Z"/>

      <circle cx="365"
              cy="610"
              r="12"/>

    </g>

  </g>


  <!-- Senator figure -->
  <g>

    <!-- toga -->
    <path d="
        M190 850
        Q210 520 330 520
        Q450 560 420 850Z"
        fill="#e4ddcf"/>


    <!-- shadow folds -->
    <path d="
        M260 600
        Q320 700 270 850"
        fill="none"
        stroke="#b7aa96"
        stroke-width="18"/>


    <!-- head -->
    <circle cx="320"
            cy="470"
            r="55"
            fill="#c58d62"/>


    <!-- hair -->
    <path d="
        M270 460
        Q320 390 370 460"
        fill="#30251d"/>


    <!-- laurel crown -->
    <g fill="#b18a32">

      <circle cx="285" cy="420" r="8"/>
      <circle cx="310" cy="410" r="8"/>
      <circle cx="340" cy="415" r="8"/>

    </g>


    <!-- scroll -->
    <rect x="390"
          y="600"
          width="80"
          height="120"
          fill="#d8bd82"
          transform="rotate(12 390 600)"/>


  </g>


  <!-- Raven symbol of conspiracy -->
  <g fill="#080808">

    <path d="
        M90 240
        Q160 170 230 240
        Q160 260 90 240Z"/>

    <circle cx="155"
            cy="220"
            r="5"
            fill="#d8b14a"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="65"
        font-weight="bold"
        fill="#ffffff">
    SENATOR'S
  </text>


  <text x="300"
        y="180"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="78"
        font-weight="bold"
        fill="#e7c36c">
    GAME
  </text>


  <!-- Genre -->
  <text x="300"
        y="230"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="8"
        fill="#f4ddae">
    HISTORICAL • THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Marcus Valerius
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#e6d09b">
    ROMA BOOKS • 2020
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d4ad55"
        stroke-width="2"/>

</svg>