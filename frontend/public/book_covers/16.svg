<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

<defs>

  <!-- Night harbor sky -->
  <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#080d16"/>
    <stop offset="55%" stop-color="#172633"/>
    <stop offset="100%" stop-color="#35444a"/>
  </linearGradient>

  <!-- Water -->
  <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#263943"/>
    <stop offset="100%" stop-color="#05080b"/>
  </linearGradient>

  <!-- Fog -->
  <radialGradient id="fog">
    <stop offset="0%" stop-color="#d9d8d0" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>

  <!-- Crime glow -->
  <radialGradient id="redGlow">
    <stop offset="0%" stop-color="#ff4538"/>
    <stop offset="50%" stop-color="#9e1717"/>
    <stop offset="100%" stop-color="#220606" stop-opacity="0"/>
  </radialGradient>

  <filter id="softBlur"
          x="-50%"
          y="-50%"
          width="200%"
          height="200%">
    <feGaussianBlur stdDeviation="25"/>
  </filter>

</defs>


<!-- Background -->
<rect width="600" height="900" fill="url(#nightSky)"/>


<!-- Moon -->
<circle cx="450" cy="180" r="70"
        fill="#d8d7c8"
        opacity="0.15"/>


<!-- Harbor fog -->
<ellipse cx="280"
         cy="420"
         rx="300"
         ry="180"
         fill="url(#fog)"
         filter="url(#softBlur)"/>


<!-- Red crime glow -->
<ellipse cx="300"
         cy="560"
         rx="170"
         ry="130"
         fill="url(#redGlow)"
         opacity="0.65"
         filter="url(#softBlur)"/>


<!-- Water -->
<path d="
M0 560
Q150 530 300 570
Q450 520 600 560
L600 900
L0 900Z"
fill="url(#water)"/>


<!-- Distant ships -->
<g fill="#050708">

  <path d="
  M80 540
  L200 540
  L170 510
  L120 510Z"/>

  <rect x="140" y="430" width="5" height="80"/>

  <path d="
  M420 550
  L560 550
  L520 515
  L460 515Z"/>

  <rect x="490" y="420" width="6" height="100"/>

</g>


<!-- Lighthouse -->
<g fill="#11151a">

  <rect x="470" y="270" width="35" height="250"/>

  <polygon points="
  455,270
  520,270
  490,230"/>

  <rect x="460" y="300" width="55" height="8"
        fill="#e8c56b"/>

</g>


<!-- Mysterious person -->
<g fill="#050505">

  <!-- head -->
  <circle cx="250" cy="560" r="25"/>

  <!-- coat -->
  <path d="
  M210 600
  Q250 560 290 600
  L330 790
  L170 790Z"/>

  <!-- legs -->
  <path d="
  M210 760
  L160 870
  L210 870
  L250 780Z"/>

  <path d="
  M280 760
  L340 870
  L390 870
  L300 740Z"/>

  <!-- detective hat -->
  <rect x="215" y="530"
        width="70"
        height="10"/>

</g>


<!-- Evidence folder -->
<g>
  <rect x="365"
        y="610"
        width="85"
        height="60"
        rx="4"
        fill="#8b1010"
        transform="rotate(-12 405 640)"/>

  <circle cx="405"
          cy="640"
          r="8"
          fill="#d9c1a0"/>
</g>


<!-- Fog layers -->
<path d="
M0 460
Q150 400 300 470
Q450 390 600 450"
fill="none"
stroke="#d8d8d0"
stroke-width="35"
opacity="0.15"/>


<!-- Title -->
<text x="300"
      y="120"
      text-anchor="middle"
      font-family="Georgia, serif"
      font-size="58"
      font-weight="bold"
      letter-spacing="4"
      fill="#f1eee6">
CRIMSON
</text>

<text x="300"
      y="185"
      text-anchor="middle"
      font-family="Georgia, serif"
      font-size="58"
      font-weight="bold"
      letter-spacing="4"
      fill="#b62020">
HARBOR
</text>


<!-- Subtitle -->
<text x="300"
      y="235"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14"
      letter-spacing="5"
      fill="#d0c7b5">
A THRILLER OF SECRETS AND REVENGE
</text>


<!-- Author -->
<text x="300"
      y="820"
      text-anchor="middle"
      font-family="Georgia, serif"
      font-size="32"
      fill="#ffffff">
Elara Vance
</text>


<!-- Publisher -->
<text x="300"
      y="860"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="13"
      letter-spacing="3"
      fill="#cfc3ae">
MAPLE LEAF PRESS • 2020
</text>


<!-- Border -->
<rect x="22"
      y="22"
      width="556"
      height="856"
      fill="none"
      stroke="#b28b62"
      stroke-width="2"
      opacity="0.5"/>


</svg>