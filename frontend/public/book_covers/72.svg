<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="polarSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06142b"/>
      <stop offset="45%" stop-color="#183b52"/>
      <stop offset="100%" stop-color="#d0c58b"/>
    </linearGradient>

    <linearGradient id="snowField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9edf0"/>
      <stop offset="100%" stop-color="#7e9aa7"/>
    </linearGradient>

    <linearGradient id="mountainIce" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#314c5b"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>

    <linearGradient id="mapPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4e5b9"/>
      <stop offset="100%" stop-color="#b59b67"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

  </defs>


  <!-- Night polar sky -->
  <rect width="600" height="900" fill="url(#polarSky)"/>


  <!-- Aurora ribbons -->
  <g fill="none"
     stroke-linecap="round"
     filter="url(#glow)">

    <path d="
        M-50 250
        Q180 80 360 230
        Q470 330 680 170"
        stroke="#64d7c5"
        stroke-width="35"
        opacity="0.75"/>

    <path d="
        M-80 330
        Q180 180 390 330
        Q500 420 650 260"
        stroke="#9f7cff"
        stroke-width="25"
        opacity="0.6"/>

    <path d="
        M-50 390
        Q200 250 420 390
        Q520 470 680 350"
        stroke="#6fe8a7"
        stroke-width="20"
        opacity="0.55"/>

  </g>


  <!-- Stars -->
  <g fill="#ffffff">

    <circle cx="90" cy="120" r="3"/>
    <circle cx="180" cy="170" r="2"/>
    <circle cx="500" cy="110" r="3"/>
    <circle cx="450" cy="230" r="2"/>
    <circle cx="330" cy="90" r="2"/>

  </g>


  <!-- Arctic mountains -->
  <path d="
      M0 520
      L150 330
      L280 520
      L430 300
      L600 520
      L600 700
      L0 700Z"
      fill="url(#mountainIce)"/>


  <!-- Snow caps -->
  <path d="
      M150 330
      L110 400
      L150 380
      L180 410
      L230 460
      Z"
      fill="#dce7eb"/>

  <path d="
      M430 300
      L370 390
      L430 365
      L470 410
      L520 470
      Z"
      fill="#e6eef0"/>


  <!-- Snow ground -->
  <path d="
      M0 620
      Q200 560 400 630
      Q520 590 600 640
      L600 900
      L0 900Z"
      fill="url(#snowField)"/>


  <!-- Expedition route map -->
  <g>

    <path d="
        M90 650
        Q250 590 420 690
        L470 790
        L150 810Z"
        fill="url(#mapPaper)"
        stroke="#755b32"
        stroke-width="5"/>


    <!-- route lines -->
    <path d="
        M150 760
        Q250 680 400 730"
        fill="none"
        stroke="#b34535"
        stroke-width="5"
        stroke-dasharray="12 8"/>


    <circle cx="150"
            cy="760"
            r="10"
            fill="#b34535"/>

    <circle cx="400"
            cy="730"
            r="10"
            fill="#b34535"/>


    <!-- compass -->
    <circle cx="300"
            cy="720"
            r="35"
            fill="none"
            stroke="#544326"
            stroke-width="4"/>

    <path d="
        M300 690
        L315 720
        L300 750
        L285 720Z"
        fill="#544326"/>

  </g>


  <!-- Traveler with telescope -->
  <g>

    <!-- head -->
    <circle cx="500"
            cy="680"
            r="25"
            fill="#1b1b1b"/>


    <!-- body -->
    <path d="
        M460 900
        Q500 700 540 900Z"
        fill="#20262c"/>


    <!-- telescope -->
    <rect x="390"
          y="700"
          width="100"
          height="18"
          rx="8"
          fill="#6c4b2b"
          transform="rotate(-20 390 700)"/>


    <circle cx="490"
            cy="690"
            r="14"
            fill="#263845"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="105"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="58"
        font-weight="bold"
        fill="#ffffff">
    AURORA TRAILS
  </text>


  <text x="300"
        y="175"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="72"
        font-weight="bold"
        fill="#d9f0e8">
    GUIDE
  </text>


  <!-- Subtitle -->
  <text x="300"
        y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="9"
        fill="#d9e7d8">
    NORTHERN LIGHTS • TRAVEL
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Elara Vance
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#e5d5a5">
    MAPLE LEAF PRESS • 2020
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#cbd8d0"
        stroke-width="2"/>

</svg>