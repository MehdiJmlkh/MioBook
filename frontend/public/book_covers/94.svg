<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="romanArchive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21151a"/>
      <stop offset="45%" stop-color="#6b4730"/>
      <stop offset="100%" stop-color="#d1a65a"/>
    </linearGradient>

    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1dc9e"/>
      <stop offset="100%" stop-color="#9d6d32"/>
    </linearGradient>

    <linearGradient id="marbleWall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#332b25"/>
      <stop offset="50%" stop-color="#8b7862"/>
      <stop offset="100%" stop-color="#2b2622"/>
    </linearGradient>

    <filter id="candleGlow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

  </defs>


  <!-- Ancient archive background -->
  <rect width="600" height="900" fill="url(#romanArchive)"/>


  <!-- Candle atmosphere -->
  <circle cx="300"
          cy="350"
          r="120"
          fill="#e5a94f"
          opacity="0.25"
          filter="url(#candleGlow)"/>


  <!-- Stone library wall -->
  <g fill="url(#marbleWall)"
     opacity="0.9">

    <rect x="40"
          y="280"
          width="520"
          height="280"/>

    <line x1="120"
          y1="280"
          x2="120"
          y2="560"
          stroke="#4c4238"
          stroke-width="8"/>

    <line x1="300"
          y1="280"
          x2="300"
          y2="560"
          stroke="#4c4238"
          stroke-width="8"/>

    <line x1="480"
          y1="280"
          x2="480"
          y2="560"
          stroke="#4c4238"
          stroke-width="8"/>

  </g>


  <!-- Roman arch -->
  <path d="
      M160 560
      L160 390
      Q300 250 440 390
      L440 560Z"
      fill="#17130f"
      stroke="#c3a06a"
      stroke-width="8"/>


  <!-- Scroll shelf -->
  <g>

    <rect x="80"
          y="600"
          width="440"
          height="35"
          fill="#5b3a22"/>


    <g fill="#d9b56a">

      <ellipse cx="150" cy="620" rx="25" ry="45"/>
      <ellipse cx="230" cy="620" rx="25" ry="45"/>
      <ellipse cx="310" cy="620" rx="25" ry="45"/>
      <ellipse cx="390" cy="620" rx="25" ry="45"/>
      <ellipse cx="470" cy="620" rx="25" ry="45"/>

    </g>

  </g>


  <!-- Open manuscript -->
  <g>

    <path d="
        M130 760
        L300 700
        L470 760
        L300 850Z"
        fill="url(#parchment)"
        stroke="#6a4724"
        stroke-width="6"/>


    <!-- Writing lines -->
    <g stroke="#76552d"
       stroke-width="4"
       opacity="0.7">

      <line x1="190" y1="760" x2="285" y2="735"/>
      <line x1="190" y1="790" x2="285" y2="765"/>
      <line x1="315" y1="735" x2="410" y2="760"/>
      <line x1="315" y1="765" x2="410" y2="790"/>

    </g>


    <!-- Wax seal -->
    <circle cx="300"
            cy="780"
            r="22"
            fill="#8d2929"/>

    <path d="
        M290 780
        L300 765
        L310 780
        L300 795Z"
        fill="#e3c36a"/>

  </g>


  <!-- Ancient scribe silhouette -->
  <g>

    <circle cx="300"
            cy="430"
            r="35"
            fill="#141210"/>


    <path d="
        M240 650
        Q300 470 360 650Z"
        fill="#141210"/>


    <!-- feather pen -->
    <line x1="350"
          y1="540"
          x2="430"
          y2="680"
          stroke="#d7bd7a"
          stroke-width="5"/>

    <path d="
        M420 680
        Q450 640 460 610"
        fill="none"
        stroke="#d7bd7a"
        stroke-width="5"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="105"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="60"
        font-weight="bold"
        fill="#ffffff">
    SCRIBES OF
  </text>


  <text x="300"
        y="180"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="70"
        font-weight="bold"
        fill="#e0b866">
    THE REPUBLIC
  </text>


  <!-- Genre -->
  <text x="300"
        y="230"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="12"
        fill="#f0dfb5">
    HISTORICAL
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Marcus Valerius
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#e1c27c">
    ROMA BOOKS • 2015
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#c9a45c"
        stroke-width="2"/>

</svg>