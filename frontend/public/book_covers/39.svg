<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="irishAdventureSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#31465a"/>
      <stop offset="45%" stop-color="#8da477"/>
      <stop offset="100%" stop-color="#d6b56d"/>
    </linearGradient>

    <linearGradient id="stoneWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a99b78"/>
      <stop offset="100%" stop-color="#4e5142"/>
    </linearGradient>

    <radialGradient id="lanternGlow">
      <stop offset="0%" stop-color="#ffd875"/>
      <stop offset="100%" stop-color="#ffd875" stop-opacity="0"/>
    </radialGradient>

    <filter id="softLight">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

  </defs>


  <!-- Irish countryside sky -->
  <rect width="600" height="900" fill="url(#irishAdventureSky)"/>


  <!-- Sunset glow -->
  <ellipse cx="300"
           cy="330"
           rx="220"
           ry="130"
           fill="url(#lanternGlow)"
           filter="url(#softLight)"/>


  <!-- Rolling hills -->
  <path d="
      M0 430
      Q150 300 300 430
      Q450 300 600 420
      L600 650
      L0 650Z"
      fill="#465d43"/>


  <path d="
      M0 520
      Q200 400 370 520
      Q500 430 600 520
      L600 700
      L0 700Z"
      fill="#6e824d"/>


  <!-- Ancient ring fort -->
  <g>

    <!-- outer earth ring -->
    <ellipse cx="300"
             cy="570"
             rx="230"
             ry="100"
             fill="none"
             stroke="#4c432d"
             stroke-width="45"/>


    <!-- stone blocks -->
    <g fill="url(#stoneWall)">

      <rect x="90"
            y="500"
            width="55"
            height="40"/>

      <rect x="155"
            y="470"
            width="55"
            height="45"/>

      <rect x="390"
            y="480"
            width="60"
            height="45"/>

      <rect x="450"
            y="520"
            width="55"
            height="40"/>

    </g>

  </g>


  <!-- Ancient entrance -->
  <g fill="#35362e">

    <rect x="260"
          y="470"
          width="80"
          height="160"/>


    <path d="
        M240 470
        Q300 380 360 470Z"/>

  </g>


  <!-- Hidden treasure chamber -->
  <g>

    <path d="
        M170 650
        L300 570
        L430 650
        L400 800
        L200 800Z"
        fill="#26231b"/>


    <!-- treasure glow -->
    <ellipse cx="300"
             cy="720"
             rx="90"
             ry="50"
             fill="url(#lanternGlow)"/>


    <!-- chest -->
    <rect x="240"
          y="680"
          width="120"
          height="70"
          fill="#8a5428"/>


    <path d="
        M240 680
        Q300 620 360 680"
        fill="#b8863b"/>


    <rect x="295"
          y="680"
          width="10"
          height="70"
          fill="#e0bd62"/>

  </g>


  <!-- Explorer -->
  <g fill="#090d0b">

    <!-- hat -->
    <ellipse cx="300"
             cy="410"
             rx="45"
             ry="15"/>


    <circle cx="300"
            cy="445"
            r="22"/>


    <!-- backpack -->
    <rect x="245"
          y="520"
          width="60"
          height="130"
          rx="15"
          fill="#453323"/>


    <!-- body -->
    <path d="
        M250 600
        Q300 520 360 600
        L430 850
        L170 850Z"/>


    <!-- lantern -->
    <circle cx="390"
            cy="580"
            r="25"
            fill="#ffce67"/>


    <rect x="375"
          y="600"
          width="30"
          height="60"
          fill="#222"/>

  </g>


  <!-- Ancient map -->
  <g>

    <path d="
        M80 720
        Q130 650 190 700
        L170 800
        Q120 760 80 800Z"
        fill="#d9c18b"/>


    <g stroke="#805b32"
       stroke-width="3">

      <line x1="110"
            y1="730"
            x2="160"
            y2="760"/>

      <line x1="130"
            y1="710"
            x2="160"
            y2="790"/>

    </g>

  </g>


  <!-- Flying birds -->
  <g fill="none"
     stroke="#253229"
     stroke-width="4">

    <path d="
        M100 250
        Q120 230 140 250
        Q160 230 180 250"/>


    <path d="
        M430 270
        Q450 250 470 270
        Q490 250 510 270"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="50"
        font-weight="bold"
        fill="#fff0bd">
    RING FORT
  </text>

  <text x="300"
        y="175"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="58"
        font-weight="bold"
        fill="#ffffff">
    ADVENTURE
  </text>


  <!-- Genre -->
  <text x="300"
        y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="8"
        fill="#e6d49a">
    ADVENTURE
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="30"
        fill="#ffffff">
    Beatrix O'Malley
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#ead39a">
    EMERALD HOUSE • 1986
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d8bd76"
        stroke-width="2"
        opacity="0.6"/>

</svg>