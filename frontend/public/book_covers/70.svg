<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="irishMorning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#25333a"/>
      <stop offset="45%" stop-color="#7c8d72"/>
      <stop offset="100%" stop-color="#d2b27b"/>
    </linearGradient>

    <linearGradient id="oldStone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c1b59a"/>
      <stop offset="45%" stop-color="#827665"/>
      <stop offset="100%" stop-color="#403c35"/>
    </linearGradient>

    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#61704a"/>
      <stop offset="100%" stop-color="#182719"/>
    </linearGradient>

    <radialGradient id="sun">
      <stop offset="0%" stop-color="#fff0b5"/>
      <stop offset="100%" stop-color="#fff0b5" stop-opacity="0"/>
    </radialGradient>

    <filter id="mistBlur">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

  </defs>


  <!-- Background -->
  <rect width="600" height="900" fill="url(#irishMorning)"/>


  <!-- Sun through clouds -->
  <circle cx="430"
          cy="180"
          r="120"
          fill="url(#sun)"
          filter="url(#mistBlur)"/>

  <circle cx="430"
          cy="180"
          r="40"
          fill="#f5df9a"/>


  <!-- Rolling Irish hills -->
  <path d="
      M0 440
      Q150 300 300 430
      Q470 290 600 440
      L600 650
      L0 650Z"
      fill="#42563d"/>


  <!-- Abbey ruins -->
  <g>

    <!-- main abbey wall -->
    <path d="
        M120 620
        L120 330
        L250 210
        L390 330
        L390 620Z"
        fill="url(#oldStone)"/>


    <!-- broken roof -->
    <path d="
        M80 340
        L250 180
        L430 340"
        fill="none"
        stroke="#575044"
        stroke-width="25"/>


    <!-- arch window -->
    <path d="
        M210 620
        L210 430
        Q250 360 290 430
        L290 620Z"
        fill="#1d2522"/>


    <!-- side tower -->
    <rect x="390"
          y="300"
          width="70"
          height="320"
          fill="#706858"/>


    <path d="
        M380 310
        L425 220
        L470 310Z"
        fill="#4c463b"/>


    <!-- stones -->
    <g stroke="#61584b"
       stroke-width="5">

      <line x1="150" y1="390" x2="350" y2="390"/>
      <line x1="140" y1="470" x2="370" y2="470"/>
      <line x1="160" y1="540" x2="350" y2="540"/>

    </g>

  </g>


  <!-- Grass foreground -->
  <path d="
      M0 600
      Q250 520 600 610
      L600 900
      L0 900Z"
      fill="url(#grass)"/>


  <!-- Stone pathway -->
  <g fill="#a99b80">

    <ellipse cx="300" cy="680" rx="65" ry="25"/>
    <ellipse cx="300" cy="750" rx="90" ry="30"/>
    <ellipse cx="300" cy="830" rx="120" ry="35"/>

  </g>


  <!-- Traveler with guide book -->
  <g>

    <circle cx="300"
            cy="610"
            r="25"
            fill="#171713"/>


    <path d="
        M260 900
        Q300 650 340 900Z"
        fill="#1b1d18"/>


    <!-- backpack -->
    <rect x="210"
          y="700"
          width="55"
          height="120"
          rx="12"
          fill="#76532d"/>


    <!-- open guidebook -->
    <path d="
        M350 690
        L430 650
        L430 760
        L350 720Z"
        fill="#e2d2a4"
        stroke="#8b6331"
        stroke-width="3"/>


    <line x1="390"
          y1="670"
          x2="390"
          y2="740"
          stroke="#8b6331"
          stroke-width="2"/>

  </g>


  <!-- Celtic map markings -->
  <g opacity="0.8">

    <circle cx="120"
            cy="730"
            r="45"
            fill="none"
            stroke="#d0b77b"
            stroke-width="3"/>


    <path d="
        M90 730
        Q120 700 150 730
        Q120 760 90 730"
        fill="none"
        stroke="#d0b77b"
        stroke-width="3"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="105"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="64"
        font-weight="bold"
        fill="#ffffff">
    OLD ABBEY
  </text>


  <text x="300"
        y="180"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="76"
        font-weight="bold"
        fill="#e7d08b">
    TRAILS
  </text>


  <!-- Genre -->
  <text x="300"
        y="230"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="8"
        fill="#f3e3bc">
    GUIDE • HISTORICAL
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Beatrix O'Malley
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#ead6a6">
    EMERALD HOUSE • 1992
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d5b878"
        stroke-width="2"/>

</svg>