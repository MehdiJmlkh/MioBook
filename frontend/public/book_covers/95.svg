<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="kyotoNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d20"/>
      <stop offset="50%" stop-color="#24354b"/>
      <stop offset="100%" stop-color="#b25b3c"/>
    </linearGradient>

    <linearGradient id="pagodaWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9d3c25"/>
      <stop offset="100%" stop-color="#3b1712"/>
    </linearGradient>

    <linearGradient id="lanternGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd77a"/>
      <stop offset="100%" stop-color="#c45b22"/>
    </linearGradient>

    <filter id="moonGlow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

  </defs>


  <!-- Japanese night sky -->
  <rect width="600" height="900" fill="url(#kyotoNight)"/>


  <!-- Moon -->
  <circle cx="460"
          cy="230"
          r="80"
          fill="#ffe8a3"
          opacity="0.35"
          filter="url(#moonGlow)"/>

  <circle cx="460"
          cy="230"
          r="45"
          fill="#f8e4ad"/>


  <!-- Mountain silhouettes -->
  <path d="
      M0 430
      L150 270
      L270 420
      L410 250
      L600 430
      L600 600
      L0 600Z"
      fill="#101927"/>


  <!-- Mist -->
  <path d="
      M0 500
      Q150 450 300 520
      Q450 580 600 500"
      fill="none"
      stroke="#d5d8d2"
      stroke-width="30"
      opacity="0.15"/>


  <!-- Twin pagodas -->
  <g>

    <!-- Left Pagoda -->
    <g transform="translate(120,260)">

      <!-- roof layers -->
      <path d="M0 90 L120 90 L60 45Z"
            fill="url(#pagodaWood)"/>

      <path d="M10 140 L110 140 L60 95Z"
            fill="url(#pagodaWood)"/>

      <path d="M20 190 L100 190 L60 145Z"
            fill="url(#pagodaWood)"/>


      <!-- body -->
      <rect x="45"
            y="90"
            width="30"
            height="160"
            fill="#54251b"/>


      <!-- spire -->
      <line x1="60"
            y1="40"
            x2="60"
            y2="0"
            stroke="#d6a44e"
            stroke-width="5"/>

    </g>


    <!-- Right Pagoda -->
    <g transform="translate(360,260)">

      <path d="M0 90 L120 90 L60 45Z"
            fill="url(#pagodaWood)"/>

      <path d="M10 140 L110 140 L60 95Z"
            fill="url(#pagodaWood)"/>

      <path d="M20 190 L100 190 L60 145Z"
            fill="url(#pagodaWood)"/>


      <rect x="45"
            y="90"
            width="30"
            height="160"
            fill="#54251b"/>


      <line x1="60"
            y1="40"
            x2="60"
            y2="0"
            stroke="#d6a44e"
            stroke-width="5"/>

    </g>

  </g>


  <!-- Bridge between temples -->
  <path d="
      M160 540
      Q300 470 440 540"
      fill="none"
      stroke="#7d4427"
      stroke-width="18"/>


  <!-- Lantern path -->
  <g fill="url(#lanternGlow)">

    <circle cx="120" cy="600" r="18"/>
    <circle cx="480" cy="600" r="18"/>
    <circle cx="220" cy="650" r="14"/>
    <circle cx="380" cy="650" r="14"/>

  </g>


  <!-- Treasure map -->
  <g>

    <path d="
        M220 720
        Q300 670 380 720
        L350 800
        Q300 760 250 800Z"
        fill="#e5c982"
        stroke="#65421e"
        stroke-width="5"/>


    <path d="
        M270 740
        Q300 710 330 760
        L300 790Z"
        fill="none"
        stroke="#9b382b"
        stroke-width="5"/>


    <circle cx="300"
            cy="760"
            r="8"
            fill="#9b382b"/>

  </g>


  <!-- Running shadow figure -->
  <g>

    <circle cx="300"
            cy="520"
            r="18"
            fill="#0b0e13"/>

    <path d="
        M280 700
        Q300 540 340 700Z"
        fill="#0b0e13"/>


    <!-- flashlight -->
    <line x1="335"
          y1="590"
          x2="410"
          y2="550"
          stroke="#ffe7a0"
          stroke-width="6"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="105"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="58"
        font-weight="bold"
        fill="#ffffff">
    TWIN PAGODA
  </text>


  <text x="300"
        y="180"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="78"
        font-weight="bold"
        fill="#f1bd62">
    PURSUIT
  </text>


  <!-- Genre -->
  <text x="300"
        y="230"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="8"
        fill="#ffffff">
    ADVENTURE • THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Hiroshi Tanaka
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#f2cf88">
    SORA PUBLISHING • 2020
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d2a45c"
        stroke-width="2"/>

</svg>