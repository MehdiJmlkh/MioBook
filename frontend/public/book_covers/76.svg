<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="darkCity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="55%" stop-color="#18202b"/>
      <stop offset="100%" stop-color="#4b3a32"/>
    </linearGradient>

    <linearGradient id="paperLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1e4bb"/>
      <stop offset="100%" stop-color="#9f875c"/>
    </linearGradient>

    <linearGradient id="woodCabinet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#593c25"/>
      <stop offset="100%" stop-color="#1b120d"/>
    </linearGradient>

    <filter id="lampGlow">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

  </defs>


  <!-- Dark city background -->
  <rect width="600" height="900" fill="url(#darkCity)"/>


  <!-- Moon -->
  <circle cx="470"
          cy="150"
          r="70"
          fill="#d8d3c2"
          opacity="0.15"/>

  <circle cx="470"
          cy="150"
          r="35"
          fill="#ece2c3"
          opacity="0.5"/>


  <!-- City skyline -->
  <g fill="#090c12">

    <rect x="30" y="360" width="70" height="220"/>
    <rect x="120" y="300" width="90" height="280"/>
    <rect x="230" y="390" width="80" height="190"/>
    <rect x="330" y="270" width="110" height="310"/>
    <rect x="470" y="340" width="80" height="240"/>

  </g>


  <!-- Office windows -->
  <g fill="#d7b86a" opacity="0.5">

    <rect x="145" y="350" width="12" height="18"/>
    <rect x="175" y="400" width="12" height="18"/>
    <rect x="360" y="340" width="14" height="20"/>
    <rect x="400" y="420" width="14" height="20"/>
    <rect x="500" y="390" width="12" height="18"/>

  </g>


  <!-- Secret cabinet -->
  <g>

    <rect x="100"
          y="430"
          width="400"
          height="260"
          rx="12"
          fill="url(#woodCabinet)"
          stroke="#b08a45"
          stroke-width="6"/>


    <!-- cabinet doors -->
    <line x1="300"
          y1="430"
          x2="300"
          y2="690"
          stroke="#b08a45"
          stroke-width="4"/>


    <!-- shelves -->
    <line x1="130"
          y1="510"
          x2="470"
          y2="510"
          stroke="#b08a45"
          stroke-width="3"/>

    <line x1="130"
          y1="600"
          x2="470"
          y2="600"
          stroke="#b08a45"
          stroke-width="3"/>


    <!-- hidden documents -->
    <rect x="160"
          y="535"
          width="70"
          height="45"
          fill="url(#paperLight)"
          transform="rotate(-8 160 535)"/>

    <rect x="340"
          y="535"
          width="90"
          height="50"
          fill="url(#paperLight)"
          transform="rotate(7 340 535)"/>


    <!-- red classified file -->
    <rect x="250"
          y="625"
          width="100"
          height="45"
          fill="#7b2525"/>

    <text x="300"
          y="655"
          text-anchor="middle"
          font-family="Arial"
          font-size="12"
          fill="#f4d8a0">
      CLASSIFIED
    </text>


    <!-- lock -->
    <circle cx="300"
            cy="470"
            r="12"
            fill="#d3aa54"/>

  </g>


  <!-- Reporter silhouette -->
  <g>

    <circle cx="80"
            cy="680"
            r="25"
            fill="#090b0f"/>


    <path d="
        M40 900
        Q80 700 120 900Z"
        fill="#090b0f"/>


    <!-- camera -->
    <rect x="120"
          y="720"
          width="70"
          height="45"
          fill="#111820"/>

    <circle cx="155"
            cy="742"
            r="15"
            fill="#485866"/>


    <!-- notebook -->
    <rect x="20"
          y="760"
          width="55"
          height="70"
          fill="#d8c58e"/>

  </g>


  <!-- Spotlight -->
  <circle cx="300"
          cy="350"
          r="120"
          fill="#d6b15f"
          opacity="0.15"
          filter="url(#lampGlow)"/>


  <!-- Title -->
  <text x="300"
        y="105"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="76"
        font-weight="bold"
        fill="#ffffff">
    SHADOW
  </text>


  <text x="300"
        y="185"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="72"
        font-weight="bold"
        fill="#d9b86c">
    CABINET
  </text>


  <!-- Genre -->
  <text x="300"
        y="235"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="12"
        fill="#cfc5a8">
    THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Julian Thorne
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#d7bd83">
    STERLING PRESS • 2016
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#b99350"
        stroke-width="2"/>

</svg>