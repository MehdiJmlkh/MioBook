<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="sendaiEvening" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10182c"/>
      <stop offset="45%" stop-color="#344d68"/>
      <stop offset="100%" stop-color="#d58b65"/>
    </linearGradient>

    <linearGradient id="paperFold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b8d4df"/>
    </linearGradient>

    <linearGradient id="cityLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe49a"/>
      <stop offset="100%" stop-color="#c56a37"/>
    </linearGradient>

    <filter id="softLight">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

  </defs>


  <!-- Sendai twilight -->
  <rect width="600" height="900" fill="url(#sendaiEvening)"/>


  <!-- Moon -->
  <circle cx="450"
          cy="190"
          r="70"
          fill="#ffe9b2"
          opacity="0.3"
          filter="url(#softLight)"/>

  <circle cx="450"
          cy="190"
          r="35"
          fill="#f9e5ae"/>


  <!-- Sendai skyline -->
  <g fill="#10151c">

    <rect x="60"
          y="450"
          width="70"
          height="170"/>

    <rect x="170"
          y="400"
          width="100"
          height="220"/>

    <rect x="320"
          y="430"
          width="90"
          height="190"/>

    <rect x="470"
          y="380"
          width="70"
          height="240"/>

  </g>


  <!-- City windows -->
  <g fill="url(#cityLight)">

    <rect x="85" y="480" width="15" height="20"/>
    <rect x="85" y="530" width="15" height="20"/>

    <rect x="200" y="440" width="20" height="25"/>
    <rect x="240" y="500" width="20" height="25"/>

    <rect x="350" y="470" width="18" height="25"/>
    <rect x="495" y="430" width="18" height="25"/>

  </g>


  <!-- Flying cranes -->
  <g fill="url(#paperFold)"
     stroke="#8ba8b7"
     stroke-width="2">


    <!-- large crane -->
    <path d="
        M250 270
        L330 220
        L400 270
        L340 280
        L390 330
        L300 300
        L240 340
        L270 285Z"/>


    <!-- smaller crane -->
    <path d="
        M110 340
        L170 300
        L220 335
        L175 345
        L205 385
        L150 360
        L100 390
        L125 345Z"/>


    <!-- distant crane -->
    <path d="
        M430 350
        L470 325
        L520 350
        L480 360
        L510 390
        L460 375
        L420 400
        L445 360Z"/>

  </g>


  <!-- Hidden message scroll -->
  <g>

    <path d="
        M170 700
        Q300 620 430 700
        L400 800
        Q300 750 200 800Z"
        fill="#e9d39a"
        stroke="#76552e"
        stroke-width="5"/>


    <!-- coded lines -->
    <g stroke="#704827"
       stroke-width="4">

      <line x1="230" y1="700" x2="370" y2="690"/>
      <line x1="220" y1="730" x2="350" y2="720"/>
      <line x1="240" y1="760" x2="330" y2="750"/>

    </g>


    <!-- secret symbol -->
    <circle cx="300"
            cy="730"
            r="18"
            fill="none"
            stroke="#9b342d"
            stroke-width="4"/>

    <path d="
        M290 730
        L300 715
        L310 730
        L300 745Z"
        fill="#9b342d"/>

  </g>


  <!-- Journalist silhouette -->
  <g>

    <circle cx="95"
            cy="670"
            r="22"
            fill="#090d14"/>


    <path d="
        M50 850
        Q95 690 145 850Z"
        fill="#090d14"/>


    <!-- camera -->
    <rect x="120"
          y="700"
          width="55"
          height="35"
          rx="5"
          fill="#1e2a35"
          stroke="#d8c38b"
          stroke-width="3"/>

    <circle cx="150"
            cy="718"
            r="9"
            fill="#d8c38b"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="100"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="68"
        font-weight="bold"
        fill="#ffffff">
    CRANES
  </text>


  <text x="300"
        y="170"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="62"
        font-weight="bold"
        fill="#f3c879">
    OVER SENDAI
  </text>


  <!-- Genre -->
  <text x="300"
        y="220"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="14"
        fill="#ffffff">
    THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Hiroshi Tanaka
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#f1d08b">
    SORA PUBLISHING • 2019
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#e0bd72"
        stroke-width="2"/>

</svg>