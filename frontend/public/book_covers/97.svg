<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="arcticLab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="45%" stop-color="#1b3445"/>
      <stop offset="100%" stop-color="#8da9ad"/>
    </linearGradient>

    <linearGradient id="glassPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8efff"/>
      <stop offset="100%" stop-color="#234554"/>
    </linearGradient>

    <linearGradient id="warningRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6355"/>
      <stop offset="100%" stop-color="#7a1518"/>
    </linearGradient>

    <filter id="blueGlow">
      <feGaussianBlur stdDeviation="15"/>
    </filter>

  </defs>


  <!-- Frozen cyber atmosphere -->
  <rect width="600" height="900" fill="url(#arcticLab)"/>


  <!-- Digital cold glow -->
  <circle cx="300"
          cy="340"
          r="150"
          fill="#5de0ff"
          opacity="0.15"
          filter="url(#blueGlow)"/>


  <!-- Snow / data particles -->
  <g fill="#bceeff">

    <circle cx="90" cy="240" r="3"/>
    <circle cx="150" cy="330" r="5"/>
    <circle cx="450" cy="280" r="4"/>
    <circle cx="510" cy="390" r="3"/>
    <circle cx="370" cy="210" r="2"/>

  </g>


  <!-- Research facility -->
  <g fill="#0b141d">

    <rect x="70"
          y="390"
          width="460"
          height="250"
          rx="10"/>


    <!-- glass sections -->
    <rect x="110"
          y="430"
          width="120"
          height="130"
          fill="url(#glassPanel)"
          opacity="0.45"/>

    <rect x="260"
          y="430"
          width="120"
          height="130"
          fill="url(#glassPanel)"
          opacity="0.35"/>

    <rect x="410"
          y="430"
          width="80"
          height="130"
          fill="url(#glassPanel)"
          opacity="0.45"/>

  </g>


  <!-- Biohazard chamber -->
  <g>

    <circle cx="300"
            cy="500"
            r="75"
            fill="#101820"
            stroke="#79d7e8"
            stroke-width="6"/>


    <!-- DNA symbol -->
    <path d="
      M275 445
      Q340 490 275 555
      M325 445
      Q260 490 325 555"
      fill="none"
      stroke="#d5f7ff"
      stroke-width="8"/>


    <line x1="285"
          y1="470"
          x2="315"
          y2="470"
          stroke="#d5f7ff"
          stroke-width="5"/>

    <line x1="285"
          y1="530"
          x2="315"
          y2="530"
          stroke="#d5f7ff"
          stroke-width="5"/>

  </g>


  <!-- Warning panel -->
  <g>

    <rect x="215"
          y="610"
          width="170"
          height="70"
          rx="8"
          fill="url(#warningRed)"
          stroke="#ffb0a8"
          stroke-width="3"/>


    <text x="300"
          y="640"
          text-anchor="middle"
          font-family="Arial"
          font-size="14"
          font-weight="bold"
          fill="#ffffff">
      PROTOCOL
    </text>


    <text x="300"
          y="662"
          text-anchor="middle"
          font-family="Arial"
          font-size="18"
          font-weight="bold"
          fill="#ffffff">
      LOCKDOWN
    </text>

  </g>


  <!-- Investigator silhouette -->
  <g>

    <circle cx="135"
            cy="600"
            r="25"
            fill="#080d12"/>


    <path d="
      M90 850
      Q135 640 180 850Z"
      fill="#080d12"/>


    <!-- tablet -->
    <rect x="150"
          y="680"
          width="55"
          height="80"
          rx="5"
          fill="#263a45"
          stroke="#8de3f4"
          stroke-width="3"/>


    <line x1="160"
          y1="705"
          x2="195"
          y2="705"
          stroke="#8de3f4"
          stroke-width="3"/>

    <line x1="160"
          y1="720"
          x2="190"
          y2="720"
          stroke="#8de3f4"
          stroke-width="3"/>

  </g>


  <!-- Encrypted data stream -->
  <g stroke="#8ce8ff"
     stroke-width="3"
     opacity="0.7">

    <line x1="410" y1="700" x2="520" y2="700"/>
    <line x1="410" y1="730" x2="480" y2="730"/>
    <line x1="410" y1="760" x2="530" y2="760"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="105"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="72"
        font-weight="bold"
        fill="#ffffff">
    COLD
  </text>


  <text x="300"
        y="180"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="76"
        font-weight="bold"
        fill="#8fe4ff">
    PROTOCOL
  </text>


  <!-- Genre -->
  <text x="300"
        y="230"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="14"
        fill="#ffffff">
    THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Julian Thorne
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#bcecff">
    STERLING PRESS • 2011
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#8fd9eb"
        stroke-width="2"/>

</svg>