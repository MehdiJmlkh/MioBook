<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="dawnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07131f"/>
      <stop offset="45%" stop-color="#34485a"/>
      <stop offset="100%" stop-color="#d59a5c"/>
    </linearGradient>

    <linearGradient id="cityShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242a32"/>
      <stop offset="100%" stop-color="#090d12"/>
    </linearGradient>

    <linearGradient id="radioMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8b8a5"/>
      <stop offset="100%" stop-color="#33383c"/>
    </linearGradient>

    <filter id="signalGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

  </defs>


  <!-- Dawn sky -->
  <rect width="600" height="900" fill="url(#dawnSky)"/>


  <!-- Radio waves in sky -->
  <g fill="none"
     stroke="#d8bf75"
     opacity="0.35">

    <path d="
      M300 260
      Q420 150 540 260"
      stroke-width="8"/>

    <path d="
      M300 260
      Q450 100 590 240"
      stroke-width="5"/>

    <path d="
      M300 260
      Q180 150 60 260"
      stroke-width="8"/>

  </g>


  <!-- Signal source glow -->
  <circle cx="300"
          cy="260"
          r="45"
          fill="#ffd47a"
          opacity="0.25"
          filter="url(#signalGlow)"/>


  <!-- Sunrise -->
  <circle cx="300"
          cy="270"
          r="28"
          fill="#ffd98a"/>


  <!-- Distant city -->
  <g fill="url(#cityShadow)">

    <rect x="40"
          y="430"
          width="70"
          height="180"/>

    <rect x="130"
          y="380"
          width="90"
          height="230"/>

    <rect x="250"
          y="410"
          width="80"
          height="200"/>

    <rect x="360"
          y="350"
          width="100"
          height="260"/>

    <rect x="500"
          y="420"
          width="60"
          height="190"/>

  </g>


  <!-- Antenna tower -->
  <g stroke="#111820"
     stroke-width="8"
     fill="none">

    <line x1="300"
          y1="410"
          x2="300"
          y2="160"/>

    <line x1="250"
          y1="410"
          x2="300"
          y2="160"/>

    <line x1="350"
          y1="410"
          x2="300"
          y2="160"/>

  </g>


  <!-- Signal pulses -->
  <g stroke="#f2c86b"
     fill="none">

    <circle cx="300"
            cy="210"
            r="70"
            stroke-width="3"/>

    <circle cx="300"
            cy="210"
            r="110"
            stroke-width="2"/>

  </g>


  <!-- Ground -->
  <path d="
      M0 610
      L600 610
      L600 900
      L0 900Z"
      fill="#12171c"/>


  <!-- Radio device -->
  <g>

    <rect x="130"
          y="640"
          width="230"
          height="150"
          rx="12"
          fill="url(#radioMetal)"
          stroke="#17191b"
          stroke-width="5"/>


    <!-- speaker -->
    <circle cx="200"
            cy="710"
            r="45"
            fill="#1b2024"/>


    <g stroke="#7e8380"
       stroke-width="3">

      <line x1="175" y1="690" x2="225" y2="690"/>
      <line x1="170" y1="705" x2="230" y2="705"/>
      <line x1="175" y1="720" x2="225" y2="720"/>
      <line x1="180" y1="735" x2="220" y2="735"/>

    </g>


    <!-- display -->
    <rect x="280"
          y="675"
          width="55"
          height="35"
          fill="#101b19"/>

    <text x="307"
          y="700"
          text-anchor="middle"
          font-family="monospace"
          font-size="18"
          fill="#77e09a">
      04:00
    </text>

  </g>


  <!-- Agent silhouette -->
  <g>

    <circle cx="470"
            cy="620"
            r="25"
            fill="#090d11"/>

    <path d="
        M420 900
        Q470 650 520 900Z"
        fill="#090d11"/>


    <!-- earpiece -->
    <path d="
        M490 620
        Q520 620 515 650"
        fill="none"
        stroke="#777"
        stroke-width="5"/>

  </g>


  <!-- Paper with coordinates -->
  <g>

    <rect x="390"
          y="720"
          width="120"
          height="90"
          fill="#ddd0a4"
          transform="rotate(8 390 720)"/>


    <path d="
        M420 750
        L480 760
        M425 775
        L470 780"
        stroke="#72502c"
        stroke-width="4"/>

    <circle cx="450"
            cy="760"
            r="8"
            fill="#b22f2f"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="100"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="70"
        font-weight="bold"
        fill="#ffffff">
    SIGNAL
  </text>


  <text x="300"
        y="175"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="76"
        font-weight="bold"
        fill="#f0ca77">
    AT DAWN
  </text>


  <!-- Genre -->
  <text x="300"
        y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="12"
        fill="#e8d8b5">
    THRILLER
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Julian Thorne
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#d9bb79">
    STERLING PRESS • 2009
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d2a75c"
        stroke-width="2"/>

</svg>