<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="romanDawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15100d"/>
      <stop offset="45%" stop-color="#6b3c20"/>
      <stop offset="100%" stop-color="#d29b4d"/>
    </linearGradient>

    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8894c"/>
      <stop offset="100%" stop-color="#3a2414"/>
    </linearGradient>

    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3d27a"/>
      <stop offset="45%" stop-color="#a86b22"/>
      <stop offset="100%" stop-color="#4b2c0c"/>
    </linearGradient>

    <radialGradient id="sunGlow">
      <stop offset="0%" stop-color="#ffe6a0"/>
      <stop offset="100%" stop-color="#e28a35" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

  </defs>


  <!-- Desert sky -->
  <rect width="600" height="900" fill="url(#romanDawn)"/>


  <!-- Rising sun -->
  <circle cx="300"
          cy="270"
          r="160"
          fill="url(#sunGlow)"
          filter="url(#softGlow)"/>

  <circle cx="300"
          cy="270"
          r="55"
          fill="#f5d890"/>


  <!-- Desert landscape -->
  <path d="
      M0 520
      Q180 420 330 520
      Q470 430 600 530
      L600 900
      L0 900Z"
      fill="url(#sand)"/>


  <!-- Distant mountains -->
  <g fill="#4b3020">

    <path d="
        M0 520
        L140 340
        L260 520Z"/>

    <path d="
        M280 520
        L440 300
        L600 520Z"/>

  </g>


  <!-- Roman eagle standard -->
  <g>

    <!-- pole -->
    <rect x="292"
          y="250"
          width="16"
          height="520"
          fill="#8b5424"/>


    <!-- eagle wings -->
    <path d="
        M300 280
        Q190 230 120 320
        Q210 330 270 360
        L300 340Z"
        fill="url(#bronze)"/>


    <path d="
        M300 280
        Q410 230 480 320
        Q390 330 330 360
        L300 340Z"
        fill="url(#bronze)"/>


    <!-- eagle body -->
    <ellipse cx="300"
             cy="315"
             rx="35"
             ry="55"
             fill="#b77a2d"/>


    <!-- eagle head -->
    <circle cx="300"
            cy="250"
            r="22"
            fill="#d49a40"/>


    <!-- beak -->
    <path d="
        M320 250
        L350 260
        L320 270Z"
        fill="#f0c45c"/>


    <!-- emblem -->
    <circle cx="300"
            cy="410"
            r="45"
            fill="none"
            stroke="#d9ad55"
            stroke-width="5"/>

    <path d="
        M300 375
        L330 420
        L300 455
        L270 420Z"
        fill="none"
        stroke="#d9ad55"
        stroke-width="5"/>

  </g>


  <!-- Roman soldier silhouette -->
  <g>

    <!-- helmet -->
    <circle cx="220"
            cy="620"
            r="35"
            fill="#17130f"/>

    <path d="
        M180 600
        Q220 540 260 600"
        fill="#252019"/>


    <!-- armor -->
    <path d="
        M150 880
        Q170 650 220 650
        Q270 650 290 880Z"
        fill="#151515"/>


    <!-- shield -->
    <path d="
        M100 690
        Q150 640 190 700
        L160 820
        Q120 790 100 690Z"
        fill="#6d321b"
        stroke="#d19a43"
        stroke-width="5"/>


    <!-- sword -->
    <path d="
        M280 850
        L360 600"
        stroke="#d8d4c5"
        stroke-width="10"/>

  </g>


  <!-- Marching legion in distance -->
  <g fill="#21140d" opacity="0.7">

    <circle cx="420" cy="620" r="12"/>
    <circle cx="460" cy="630" r="12"/>
    <circle cx="500" cy="615" r="12"/>

    <path d="M405 750 L420 640 L435 750Z"/>
    <path d="M445 760 L460 650 L475 760Z"/>
    <path d="M485 750 L500 640 L515 750Z"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="62"
        font-weight="bold"
        fill="#ffffff">
    STANDARD
  </text>


  <text x="300"
        y="180"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="68"
        font-weight="bold"
        fill="#f1cd76">
    OF THE EAGLE
  </text>


  <!-- Genre -->
  <text x="300"
        y="230"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="7"
        fill="#ffe7b0">
    ADVENTURE • HISTORICAL
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Marcus Valerius
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#f0d29a">
    ROMA BOOKS • 2013
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#d7aa52"
        stroke-width="2"/>

</svg>