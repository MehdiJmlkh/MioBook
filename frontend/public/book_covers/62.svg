<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

  <defs>

    <linearGradient id="polarSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03111d"/>
      <stop offset="45%" stop-color="#17445b"/>
      <stop offset="100%" stop-color="#b9d8dc"/>
    </linearGradient>

    <linearGradient id="iceSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fc4d2"/>
      <stop offset="100%" stop-color="#233f52"/>
    </linearGradient>

    <linearGradient id="shipMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d5dde0"/>
      <stop offset="45%" stop-color="#465866"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>

    <radialGradient id="aurora">
      <stop offset="0%" stop-color="#7affd5" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7affd5" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

  </defs>


  <!-- Polar atmosphere -->
  <rect width="600" height="900" fill="url(#polarSky)"/>


  <!-- Aurora -->
  <ellipse cx="300"
           cy="160"
           rx="280"
           ry="120"
           fill="url(#aurora)"
           filter="url(#glow)"/>


  <path d="
      M0 170
      Q160 40 300 160
      Q460 270 600 120"
      fill="none"
      stroke="#8df0d0"
      stroke-width="16"
      opacity="0.35"/>


  <!-- Stars -->
  <g fill="#ffffff">

    <circle cx="90" cy="130" r="3"/>
    <circle cx="180" cy="90" r="4"/>
    <circle cx="500" cy="150" r="3"/>
    <circle cx="420" cy="70" r="2"/>

  </g>


  <!-- Ice cliffs -->
  <path d="
      M0 470
      L100 250
      L200 450
      L340 210
      L470 440
      L600 300
      L600 600
      L0 600Z"
      fill="#d8edf1"/>


  <path d="
      M100 250
      L200 450
      L150 420
      L70 500Z"
      fill="#89b6c4"/>


  <path d="
      M340 210
      L470 440
      L390 400
      L300 470Z"
      fill="#8aaebc"/>


  <!-- Frozen ocean -->
  <path d="
      M0 540
      Q200 500 600 560
      L600 900
      L0 900Z"
      fill="url(#iceSea)"/>


  <!-- Ice cracks -->
  <g stroke="#d6f4fa"
     stroke-width="5"
     opacity="0.7">

    <path d="M80 650 L160 700 L130 800"/>
    <path d="M470 600 L420 720 L500 850"/>

  </g>


  <!-- Icebreaker ship -->
  <g>

    <!-- hull -->
    <path d="
        M110 590
        L470 590
        L400 700
        L180 700Z"
        fill="url(#shipMetal)"
        stroke="#dce8eb"
        stroke-width="4"/>


    <!-- red rescue stripe -->
    <path d="
        M140 620
        L450 620
        L430 650
        L160 650Z"
        fill="#b52c2c"/>


    <!-- cabin -->
    <rect x="250"
          y="460"
          width="120"
          height="130"
          fill="#2a3d49"/>


    <!-- windows -->
    <g fill="#a9e4f2">

      <rect x="270" y="490" width="25" height="25"/>
      <rect x="310" y="490" width="25" height="25"/>
      <rect x="350" y="490" width="25" height="25"/>

    </g>


    <!-- antenna -->
    <line x1="310"
          y1="460"
          x2="310"
          y2="380"
          stroke="#343434"
          stroke-width="5"/>


    <!-- radar -->
    <circle cx="310"
            cy="380"
            r="18"
            fill="#e0e5e8"/>

  </g>


  <!-- Sabotage warning symbol -->
  <g>

    <circle cx="130"
            cy="760"
            r="55"
            fill="#111820"
            stroke="#d83b32"
            stroke-width="6"/>


    <path d="
        M105 760
        L155 720
        L155 800Z"
        fill="#d83b32"/>

  </g>


  <!-- Explorer silhouette -->
  <g>

    <circle cx="520"
            cy="700"
            r="25"
            fill="#101820"/>


    <path d="
        M470 900
        Q500 730 550 730
        Q580 800 600 900Z"
        fill="#101820"/>

  </g>


  <!-- Title -->
  <text x="300"
        y="110"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="70"
        font-weight="bold"
        fill="#ffffff">
    ICEBREAKER
  </text>


  <text x="300"
        y="180"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="75"
        font-weight="bold"
        fill="#b8e8ef">
    RUN
  </text>


  <!-- Genre -->
  <text x="300"
        y="230"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="8"
        fill="#e5f6f8">
    THRILLER • ADVENTURE
  </text>


  <!-- Author -->
  <text x="300"
        y="825"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="32"
        fill="#ffffff">
    Elara Vance
  </text>


  <!-- Publisher -->
  <text x="300"
        y="865"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#d6edf0">
    MAPLE LEAF PRESS • 2018
  </text>


  <!-- Border -->
  <rect x="22"
        y="22"
        width="556"
        height="856"
        fill="none"
        stroke="#b9e4eb"
        stroke-width="2"/>

</svg>